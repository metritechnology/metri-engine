name: Rust CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: flatc (FlatBuffers compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatbuffers-compiler-dev
          flatc --version

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test --lib

      - name: Referencia desactualizada (docs/reference)
        run: python3 scripts/docs/gen_reference.py --check

      - name: Clippy (línea base registrada: 73 hallazgos al 2-sep-2026 (Fase 2: desde 348))
        run: cargo clippy --all-targets 2>&1 | tee clippy_baseline.txt
        continue-on-error: true

      - name: Clippy no debe crecer
        run: |
          COUNT=$(grep -c "^warning" clippy_baseline.txt || true)
          echo "Hallazgos clippy: $COUNT"
          if [ "$COUNT" -gt 73 ]; then
            echo "::error::Clippy creció por encima de la línea base (73): $COUNT"
            exit 1
          fi
