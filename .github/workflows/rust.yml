name: Rust CI

on:
  pull_request:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: flatc (FlatBuffers compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatbuffers-compiler-dev
          flatc --version

      - name: Formato (rustfmt — no negociable)
        run: cargo fmt --check

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test --lib

      - name: Referencia desactualizada (docs/reference)
        run: python3 scripts/docs/gen_reference.py --check

      # PLAN_PATRON_RESULT.md — Fase 5 (cierre estricto): el auditor corre en
      # modo --strict: cero violaciones de patrón Result y catálogo perfecto.
      # La cerradura de compilación es el deny de clippy en lib.rs/main.rs.
      - name: Patrón Result — auditoría estricta (cero violaciones)
        run: python3 scripts/dev/check_result_pattern.py --strict

      # PLAN_DOCUMENTACION.md — Fase 0: ratchet de cabeceras //! (§2.7).
      # Corre en modo ratchet (no --strict) hasta cerrar la Fase 5.
      - name: Documentación — auditor de cabeceras (ratchet)
        run: python3 scripts/dev/check_docs.py

      # Fase 0: los ERRORES de clippy (deny-by-default o compilación) bloquean.
      # La salida se captura a archivo para que el gate decida, no `tee`.
      - name: Clippy (captura de hallazgos)
        run: cargo clippy --all-targets > clippy_baseline.txt 2>&1 || true

      - name: Clippy — cero errores y sin crecer sobre la línea base
        run: |
          if grep -q "^error" clippy_baseline.txt; then
            echo "::error::clippy reportó errores (no negociables):"
            grep "^error" clippy_baseline.txt
            exit 1
          fi
          # 88 = total REAL sobre árbol verde (el 73 anterior se midió sobre
          # una compilación que fallaba en lib test y no contaba todos los
          # targets). Origen: 348. Solo puede bajar.
          COUNT=$(grep -c "^warning" clippy_baseline.txt || true)
          echo "Hallazgos clippy: $COUNT"
          if [ "$COUNT" -gt 88 ]; then
            echo "::error::Clippy creció por encima de la línea base (88): $COUNT"
            exit 1
          fi

  supply-chain:
    # Fase 0 — licencias, advisories y duplicados de dependencias.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-deny (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    # Fase 0 — línea base de cobertura SIN gate: se publica para que la
    # tendencia sea visible; el umbral se fijará cuando la cifra sea estable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: flatc (FlatBuffers compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatbuffers-compiler-dev

      - name: cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cobertura unitaria (resumen)
        run: cargo llvm-cov --lib --summary-only

      - name: Reporte LCOV
        run: cargo llvm-cov --lib --lcov --output-path lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
