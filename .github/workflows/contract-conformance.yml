name: Contract Conformance

on:
  pull_request:
    paths:
      - "proto/**"
      - "config/**"
      - "tests/contract_conformance.rs"
      - ".github/workflows/contract-conformance.yml"
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: flatc (FlatBuffers compiler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatbuffers-compiler-dev
      - name: Conformidad de contratos (Rust nativo)
        run: cargo test --test contract_conformance
