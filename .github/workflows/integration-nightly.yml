name: Integration (nightly)

# Ejecuta las suites completas de integración y E2E sobre el motor unificado .mbf.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: flatc 25.12.19 (binario oficial, alineado al crate)
        run: |
          curl --retry 5 --retry-delay 5 --retry-all-errors -sSfLo flatc.zip \
            "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip"
          sudo unzip -o flatc.zip -d /usr/local/bin
          flatc --version

      - name: protoc (gRPC/tonic)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google*chrome*
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq protobuf-compiler

      - name: Tests de integración y E2E (tests/*)
        run: make test-integration

