name: Integration (nightly)

# Fase 0 — los tests #[ignore] corren contra DynamoDB Local + MinIO + ElasticMQ.
# No bloquean PRs (necesitan contenedores); corren a diario y a demanda.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: flatc 25.12.19 (binario oficial, alineado al crate)
        run: |
          curl -sSfLo flatc.zip \
            "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip"
          sudo unzip -o flatc.zip -d /usr/local/bin
          flatc --version

      - name: protoc (gRPC/tonic)
        run: |
          # Repo apt de Chrome del runner: índices intermitentes con hash sum
          # distinto. Se elimina en cualquier formato (.list/.sources) y se
          # tolera el fallo de update: los índices de Ubuntu bastan para protoc.
          sudo rm -f /etc/apt/sources.list.d/google*chrome*
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq protobuf-compiler

      - name: Infra local (DynamoDB · MinIO · ElasticMQ)
        run: make infra

      - name: Tests de integración (#[ignore])
        run: make test-integration

      - name: Logs de infra si algo falló
        if: failure()
        run: docker compose logs --tail 100
