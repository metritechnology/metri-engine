AWSTemplateFormatVersion: "2010-09-09"
# Force deployment
Transform: AWS::Serverless-2016-10-31
Description: >
  metri-engine

  AWS SAM Template — Metri Engine (Rust / provided.al2023) - gRPC Puro
  Binary nativo ARM64 compilado con cargo-lambda. Lambda Function URL para
  gRPC Streams sin límite de 29s. EAV Single Table Design con 4 GSIs canónicos.

Parameters:
  CustomDomainName:
    Type: String
    Default: engine.metri.one
    Description: "Dominio personalizado para Metri Engine en Route 53"
  HostedZoneId:
    Type: String
    Default: "Z0492322W8B6QV4SG4W4"
    Description: "ID de la Zona Hospedada en Route 53 para el dominio base"
  AcmCertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:982592308819:certificate/aadd1dab-ffed-467f-b039-43419a4b318c"
    Description: "ARN del Certificado SSL en us-east-1 (requerido para CloudFront)"
  EavTableName:
    Type: String
    Default: metri-prod
    Description: "Nombre físico de la tabla EAV principal (Single Table Design con 4 GSIs — EAVT/AEVT/AVET/VAET)."
  AthenaWorkGroup:
    Type: String
    Default: metri-analytics
    Description: "Workgroup operativo de AWS Athena."
  # Origen CORS adicional para desarrollo local.
  # En producción dejar vacío (default). Ejemplo: sam deploy --parameter-overrides DevCorsOrigin=http://localhost:3000
  DevCorsOrigin:
    Type: String
    Default: ""
    Description: "Origen CORS de desarrollo (http://localhost:PORT). Vacío en producción."

Globals:
  Function:
    Timeout: 900
    MemorySize: 512 # Rust binary — mucho menor footprint que JVM. Ajustar a 1024 si se habilita análisis in-process.

Conditions:
  # Activo solo cuando el deployer pasa un origen de desarrollo explicitamente.
  # En produccion (default DevCorsOrigin="") esta condicion es FALSE →
  # los origenes localhost JAMAS aparecen en la Function URL de produccion.
  HasDevCorsOrigin: !Not [!Equals [!Ref DevCorsOrigin, ""]]

Resources:
  # ── Escudo Criptográfico FASE 10 (Zero-Trust Data At Rest) ──
  MetriKmsMasterKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "Llave Simétrica Maestra compartida para cifrar Variables de Entorno, S3, DynamoDB y SQS."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: "metri-key-policy"
        Statement:
          # ── Statement 1: Operaciones catastróficas — requieren MFA ──────────────────
          # SOLO las dos acciones que destruyen o paralizan la llave irreversiblemente.
          # ScheduleKeyDeletion: destruye la llave y TODOS los datos cifrados (7-30 días).
          # DisableKey: detiene toda encriptación/desencriptación hasta que se reactive.
          # aws:MultiFactorAuthPresent bloquea ejecución desde Access Keys largas sin MFA.
          - Sid: "AllowDestructiveOpsWithMFA"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
              - "kms:DisableKey"
            Resource: "*"
            Condition:
              Bool:
                "aws:MultiFactorAuthPresent": "true"

          # ── Statement 2: Administración no-destructiva — sin MFA ────────────────────
          # CloudFormation (SAM deploy) necesita kms:PutKeyPolicy para actualizar
          # la política de la llave en cada deploy. Separado del Statement 1 para
          # que la automatización CI/CD no quede bloqueada por la condición MFA.
          # Incluye: rotación, etiquetado, descripción — NO incluye Delete ni Disable.
          - Sid: "AllowKeyAdministration"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*" # kms:PutKeyPolicy — requerido por CloudFormation
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:TagResource"
              - "kms:UntagResource"
            Resource: "*"

          # ── Statement 3: Delegación IAM — operaciones criptográficas ────────────────
          # Permite que los roles IAM adjuntos a Lambda, Firehose, SQS, DynamoDB y
          # Secrets Manager usen la llave via sus propias políticas IAM (least privilege).
          - Sid: "AllowIAMDelegation"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Decrypt"
              - "kms:Encrypt"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
              - "kms:ReEncrypt*"
              - "kms:CreateGrant"
              - "kms:ListGrants"
              - "kms:RevokeGrant"
            Resource: "*"

  MetriKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: "alias/metri-engine-cmk"
      TargetKeyId: !Ref MetriKmsMasterKey

  # ── Capa Perimetral de Seguridad (Edge Proxy HTTP/2 gRPC) ──
  MetriWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: metri-engine-waf
      Scope: CLOUDFRONT # ATENCIÓN: El stack debe desplegarse en us-east-1 para WAF CloudFront
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: false  # no necesita métricas CW ($0.30/métrica/mes)
        MetricName: MetriWebACLMetrics
      Rules:
        # ── REGLA 1: Filtro Protocolar — solo POST y OPTIONS (Priority 5) ────────────
        # Metri Engine es gRPC-Web puro. El protocolo solo emite:
        #   POST  → llamadas gRPC (Discovery, Query, Transact, BulkIngest…)
        #   OPTIONS → preflight CORS del browser
        # GET, PUT, DELETE, HEAD, TRACE → bloqueo directo en el edge de CloudFront.
        # Elimina scanners REST, herramientas de fuzzing y bots HTTP genéricos.
        - Name: MetriBlockNonGrpcMethods
          Priority: 5
          Action:
            Block: {}
          Statement:
            NotStatement:
              Statement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        SearchString: "POST"
                        PositionalConstraint: EXACTLY
                        TextTransformations:
                          - Priority: 0
                            Type: NONE # HTTP methods ya llegan en mayúsculas (RFC 7231)
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        SearchString: "OPTIONS"
                        PositionalConstraint: EXACTLY
                        TextTransformations:
                          - Priority: 0
                            Type: NONE # HTTP methods ya llegan en mayúsculas (RFC 7231)
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # Regla pasiva — no necesita métricas CW ($0.30/métrica/mes)
            MetricName: MetriBlockNonGrpcMethodsMetrics

        # ── REGLA 2: Rate Limiting por IP (Priority 10) ──────────────────────────────
        # Anti-DDoS y Anti-Denial-of-Wallet (Athena cobra por query ejecutada).
        # 1000 req/5min ≈ 3.3 req/s por IP — suficiente para dashboards B2B legítimos.
        - Name: MetriRateLimitRule
          Priority: 10
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # no necesita métricas CW ($0.30/métrica/mes)
            MetricName: MetriRateLimitRuleMetrics

        # ── REGLA 3: IP Reputation List (Priority 20) ────────────────────────────────
        # Bloquea IPs de botnets, C&C servers y proxies tóxicos — telemetría AWS.
        - Name: AWS-AmazonIpReputationList
          Priority: 20
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # no necesita métricas CW ($0.30/métrica/mes)
            MetricName: AWSIpReputationMetrics

        # ── REGLA 4: Anonymous IP List (Priority 25) ─────────────────────────────────
        # Bloquea Tor exit nodes y VPNs anónimas usadas para evasión de rate-limit.
        # ExcludedRules: HostingProviderIPList — los tenants empresariales pueden
        # legítimamente llamar desde sus propios ambientes cloud (AWS/GCP/Azure).
        - Name: AWS-AWSManagedRulesAnonymousIpList
          Priority: 25
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
              ExcludedRules:
                - Name: HostingProviderIPList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # Regla pasiva — no necesita métricas CW ($0.30/métrica/mes)
            MetricName: AWSAnonymousIpMetrics

        # ── REGLA 5: Known Bad Inputs — Log4Shell / JNDI (Priority 30) ──────────────
        # Intercepta cadenas ${jndi:...} en cualquier campo (protección log4shell).
        - Name: AWS-KnownBadInputsRuleSet
          Priority: 30
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # Regla pasiva — no necesita métricas CW ($0.30/métrica/mes)
            MetricName: AWSKnownBadInputsMetrics

        # ── REGLA 6: Common Rule Set — Protecciones Generales (Priority 40) ─────────
        # Cubre: path traversal (../), command injection, HTTP protocol violations,
        # header injection y HTTP request smuggling.
        # ExcludedRules: SizeRestrictions_BODY — QueryRequest (batch de N analytics)
        # y BulkIngest pueden superar los 8KB de inspección de WAF CloudFront.
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 40
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # Regla pasiva — no necesita métricas CW ($0.30/métrica/mes)
            MetricName: AWSCommonRuleSetMetrics

        # ── REGLA 7: SQL Injection — Protección Athena (Priority 45) ────────────────
        # CRÍTICO para Metri Engine: el Janus Router compila FilterCriteria,
        # FormulaEntry y FilterOperator.MATCHES en SQL real de AWS Athena.
        # Esta regla intercepta patrones SQLi en URI y headers ANTES de que
        # lleguen al compilador JVM — previene query injection y exfiltración de datos.
        - Name: AWS-AWSManagedRulesSQLiRuleSet
          Priority: 45
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # no necesita métricas CW ($0.30/métrica/mes)
            MetricName: AWSSQLiMetrics

        # ── REGLA 8: gRPC-Web Protocol Enforcement (Priority 50) ─────────────────────
        # Todo POST a Metri DEBE incluir Content-Type: application/grpc-web[+proto|text].
        # Bloquea: scanners REST (Postman, curl genérico), fuzzing tools (ffuf, wfuzz),
        # bots HTTP que no conocen el protocolo gRPC-Web.
        # La condición AND asegura que OPTIONS (preflight CORS) nunca sea bloqueado.
        - Name: MetriGrpcProtocolEnforcement
          Priority: 50
          Action:
            Block: {}
          Statement:
            AndStatement:
              Statements:
                # Aplica solo a POST — OPTIONS no lleva Content-Type gRPC
                - ByteMatchStatement:
                    FieldToMatch:
                      Method: {}
                    SearchString: "POST"
                    PositionalConstraint: EXACTLY
                    TextTransformations:
                      - Priority: 0
                        Type: NONE # HTTP methods ya llegan en mayúsculas (RFC 7231)
                # Bloquea si Content-Type NO es application/grpc-web[+proto|text]
                - NotStatement:
                    Statement:
                      ByteMatchStatement:
                        FieldToMatch:
                          SingleHeader:
                            Name: "content-type"
                        SearchString: "application/grpc"
                        PositionalConstraint: STARTS_WITH
                        TextTransformations:
                          - Priority: 0
                            Type: LOWERCASE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false  # Regla pasiva — no necesita métricas CW ($0.30/métrica/mes)
            MetricName: MetriGrpcProtocolEnforcementMetrics

  MetriLambdaPublicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MetriEngineFunction
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  MetriCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        # HTTP/2 de cara al visor.
        #
        # **No da soporte a gRPC nativo**, pese a lo que decía el comentario
        # anterior. Verificado contra el endpoint el 2026-08-14:
        #
        #   application/grpc          → HTTP 400
        #   application/grpc-web+proto → HTTP 200 + grpc-status
        #
        # Ambas llegan al origen (cabeceras `x-amzn-*`), así que el límite no
        # está aquí: **Lambda Web Adapter entrega HTTP/1.1 al proceso local**, y
        # gRPC nativo exige HTTP/2 de extremo a extremo con trailers HTTP/2.
        # gRPC-Web funciona porque lleva los trailers dentro del cuerpo.
        #
        # Consecuencia: activar `GrpcConfig` en el cache behavior no arregla
        # nada mientras el engine se despliegue como Lambda + LWA. Servir gRPC
        # nativo exigiría otra topología (ECS/Fargate tras un NLB).
        HttpVersion: http2
        WebACLId: !GetAtt MetriWebACL.Arn
        Aliases:
          - !Ref CustomDomainName
        Origins:
          - Id: MetriEngineOrigin
            # Extrae solo el dominio del FunctionUrl suprimiendo https:// y barra final
            DomainName:
              !Select [
                2,
                !Split ["/", !GetAtt MetriEngineFunctionUrl.FunctionUrl],
              ]
            OriginCustomHeaders:
              - HeaderName: X-Metri-Origin-Token
                # Resuelve el valor real del secret en tiempo de deploy — criptográficamente seguro.
                # Rotación: actualizar MetriHMACSecret invalida TODOS los tokens Y el origin token simultaneamente.
                HeaderValue: !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: MetriEngineOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          # ID Política administrada: CachingDisabled (Esencial para Streams/gRPC)
          CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          # ID Política administrada: Managed-AllViewerExceptHostHeader (Pasa todos los headers incluyendo Origin y CORS preflight sin colisión TLS Host)
          OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only

  MetriDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        # Z2FDTNDATAQYW2 es el ID constante de AWS común para todas las distros CloudFront
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt MetriCloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  # ── Nota de Arquitectura (Zero-Trust sin VPC) ──
  # La VPC, subnets, route tables, security groups, Interface Endpoints (SQS, Athena,
  # Firehose, Glue, EventBridge) y Valkey Serverless fueron ELIMINADOS deliberadamente.
  #
  # Razón: los Interface Endpoints costaban ~$36/mes fijos + Valkey ~$5-20/mes,
  # representando el 80%+ de la factura AWS. No añaden protección real porque:
  #   1. Lambda ya está detrás de CloudFront + WAF (rate-limit, IP reputation, JNDI)
  #   2. X-Metri-Origin-Token valida que solo CloudFront llame a Lambda
  #   3. IAM Least Privilege controla acceso a cada servicio AWS
  #   4. KMS CMK cifra todos los datos en reposo
  #
  # Todos los servicios (DynamoDB, S3, SQS, Athena, Firehose, Glue, EventBridge)
  # son accesibles desde Lambda vía sus APIs públicas de AWS con autenticación IAM.
  #
  # Autenticación: tokens HMAC-SHA256 auto-contenidos (mk_<payload>.<sig>).
  #   - Verificación local en JVM: <0.1ms, $0, sin red.
  #   - Secret en AWS Secrets Manager (MetriHMACSecret), cargado una vez en SnapStart.
  #   - Revocación masiva: rotar MetriHMACSecret → todos los tokens inválidos al instante.
  #   - Revocación individual: blacklist REVOKED#<jti> en MetriSchemasTable con TTL.
  #
  # Ahorro: ~$41-56/mes (≥ 80% reducción de costos de red).

  # ── Almacenamiento Analítico (OLAP) ──
  MetriDataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "metri-lake-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref MetriKmsMasterKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── Glue Data Catalog — OLAP Schema Registry (Columnar Nativo) ────────────────────────────
  # Una base de datos por ambiente — las tablas Iceberg se crean via iceberg-seeder (CI/CD).
  # Arquitectura: una tabla Iceberg nativa por entidad OLAP (sin Raw Zone genérica).
  #   metre_olap.meter_reading  → columnas: id, _tenant, created_at, asset_id, reading_value ...
  #   metre_olap.audit_log      → columnas: id, _tenant, created_at, tenant_id, action_type ...
  #   metre_olap.domain_fault   → columnas: id, _tenant, created_at, trace_id, error_code ...
  #   metre_olap.inventory_ledger → columnas: id, _tenant, created_at, part_id, quantity_change ...
  MetriGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: metri_olap
        Description: "Metri Engine — Data Lake OLAP Columnar (Iceberg/Parquet por Entidad)"
        LocationUri: !Sub "s3://metri-lake-${AWS::AccountId}-${AWS::Region}/iceberg-data/"

  # ── Firehose Delivery Streams (gestionados dinámicamente por firehose-seeder) ───────────────
  # Los streams se crean vía `make sync-firehose` (metri.codice.firehose-seeder/sync-streams!)
  # que lee el registry de Códice y hace upsert idempotente de un DeliveryStream por entidad OLAP.
  #
  # Naming convention: metri-olap-stream-<entity-slug>
  #   entity:  meter_reading     → stream: metri-olap-stream-meter-reading
  #   entity:  audit_log         → stream: metri-olap-stream-audit-log
  #   entity:  domain_fault      → stream: metri-olap-stream-domain-fault
  #   entity:  inventory_ledger  → stream: metri-olap-stream-inventory-ledger
  #
  # Para añadir una nueva entidad OLAP:
  #   1. Crear resources/models/<entity>.json con "engine": "olap"
  #   2. Ejecutar: make sync-iceberg   (crea la tabla Athena/Iceberg)
  #   3. Ejecutar: make sync-firehose  (crea el DeliveryStream)
  #   CERO cambios en este archivo template.yaml.

  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: firehose-s3-iceberg-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt MetriDataLakeBucket.Arn
                  - !Sub "${MetriDataLakeBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !GetAtt MetriKmsMasterKey.Arn
              # ── Glue: wildcard sobre todas las tablas OLAP (no requiere cambios al añadir entidades) ──
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:UpdateTable
                  - glue:GetDatabase
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/metri_olap"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/metri_olap/*"

  # ── Tabla EAV Principal (OLTP — Single Table Design con 4 GSIs canónicos) ──
  # Arquitectura: §III del Blueprint EAV Metri.
  # PK = "T#<tenant>#E#<eid>"  SK = [attr_id:2B][tx_id:8B][op:1B]
  # GSI-AEVT: buscar todos los valores de un atributo a través de entidades
  # GSI-AVET: buscar entidades por valor de atributo (lookup inverso)
  # GSI-VAET: navegar referencias entre entidades (grafo)
  # GSI-TENANT: listar todas las entidades de un tenant por tipo
  MetriEavTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref EavTableName
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref MetriKmsMasterKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: B
        - AttributeName: ap
          AttributeType: S
        - AttributeName: as
          AttributeType: B
        - AttributeName: vp
          AttributeType: S
        - AttributeName: vs
          AttributeType: B
        - AttributeName: rp
          AttributeType: S
        - AttributeName: rs
          AttributeType: B
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # AEVT — (Attribute, Entity, Value, Tx): todos los valores de un atributo
        - IndexName: GSI-AEVT
          KeySchema:
            - AttributeName: ap
              KeyType: HASH
            - AttributeName: as
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # AVET — (Attribute, Value, Entity, Tx): lookup inverso por valor
        - IndexName: GSI-AVET
          KeySchema:
            - AttributeName: vp
              KeyType: HASH
            - AttributeName: vs
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # VAET — (Value, Attribute, Entity, Tx): navegación de referencias (grafo)
        - IndexName: GSI-VAET
          KeySchema:
            - AttributeName: rp
              KeyType: HASH
            - AttributeName: rs
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── Tabla de Metadatos del Sistema (blacklist HMAC, cache schemas) ──
  MetriSchemasTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref MetriKmsMasterKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # TTL nativo — borra automáticamente items REVOKED#<jti> expirados (blacklist HMAC)
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH

  # ── HMAC Signing Secret ─────────────────────────────────────────────────
  # Secret auto-generado de 64 bytes (512 bits) para firmar tokens HMAC-SHA256.
  # Rotación: rotar este secret invalida TODOS los tokens emitidos (revocación masiva).
  # Lambda lo carga UNA VEZ al arranque via Secrets Manager API — SnapStart lo congela en RAM.
  MetriHMACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "metri-hmac-secret-${AWS::StackName}"
      Description: "Secret HMAC-SHA256 para firma de tokens Metri Engine. Rotar = invalida todos los tokens."
      KmsKeyId: !Ref MetriKmsMasterKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: false
        IncludeSpace: false

  # ── Despacho EDA (Outbox) ──
  MetriOutboxDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: metri-outbox-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      KmsMasterKeyId: !Ref MetriKmsMasterKey
      KmsDataKeyReusePeriodSeconds: 300

  MetriOutboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: metri-outbox.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      KmsMasterKeyId: !Ref MetriKmsMasterKey
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MetriOutboxDLQ.Arn
        maxReceiveCount: 3

  # ── Rust Engine (provided.al2023 / ARM64) ──
  # Build: cargo lambda build --release --arm64
  # Deploy: sam deploy (empaqueta el binario bootstrap desde target/lambda/bootstrap/)
  MetriEngineFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile # usa Makefile target build-MetriEngineFunction
    Properties:
      MemorySize: 2048
      CodeUri: .
      Handler: bootstrap # binario Rust compilado por cargo-lambda
      Runtime: provided.al2023
      Architectures:
        - arm64 # Graviton2: 20% más rápido, 20% más barato que x86_64
      Layers:
        # AWS Lambda Web Adapter (convierte Lambda API a HTTP/2 gRPC proxy local al port 9090)
        - "arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:24"

      KmsKeyArn: !GetAtt MetriKmsMasterKey.Arn
      AutoPublishAlias: live
      # SnapStart no aplica a provided.al2023 — Rust cold start < 10ms nativo

      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM # Requerido para gRPC (soporte de HTTP Trailers)

      # Sin VpcConfig: Lambda accede a servicios AWS via API publica + IAM (sin costo de red)

      # Reglas de Cero Confianza (Minimum Least Privilege)
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MetriDataLakeBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref MetriSchemasTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MetriOutboxQueue.QueueName
        - Statement:
            # ── KMS: operaciones criptográficas ──
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey*
              Resource: !GetAtt MetriKmsMasterKey.Arn

            # ── Glue Data Catalog: OLAP schema registry ──
            - Effect: Allow
              Action:
                - glue:GetDatabase
                - glue:GetTable
                - glue:CreateTable
                - glue:UpdateTable
              Resource:
                - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/metri_olap"
                - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/metri_olap/*"

            # ── Athena: queries analíticos OLAP ──
            - Effect: Allow
              Action:
                - athena:StartQueryExecution
                - athena:GetQueryExecution
                - athena:GetQueryResults
                - athena:StopQueryExecution
              Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"

            # ── Tabla EAV (OLTP): plano de datos — sin DeleteItem (inmutable append-only) ──
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:BatchGetItem
                - dynamodb:BatchWriteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:TransactWriteItems
                - dynamodb:TransactGetItems
              Resource:
                - !GetAtt MetriEavTable.Arn
                - !Sub "${MetriEavTable.Arn}/index/*"

            # ── Tabla EAV: describe (bootstrap del engine) ──
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
              Resource: !GetAtt MetriEavTable.Arn

            # ── OLAP: Kinesis Firehose (todos los streams de entidades OLAP) ──
            - Effect: Allow
              Action:
                - firehose:PutRecord
                - firehose:PutRecordBatch
              Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/metri-olap-*"

            # ── OLAP: Kinesis Data Stream ──
            - Effect: Allow
              Action:
                - kinesis:PutRecord
                - kinesis:PutRecords
                - kinesis:DescribeStream
              Resource: !Sub "arn:aws:kinesis:${AWS::Region}:${AWS::AccountId}:stream/metri-olap-stream-*"

            # ── EDA: EventBridge (domain & fault events) ──
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource:
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/metri-faults"
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/metri-events"

            # ── HMAC Secret: cargado una vez en cold start ──
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref MetriHMACSecret

      Environment:
        Variables:
          ENVIRONMENT: production
          # ── Lambda Web Adapter ──
          PORT: "9090" # LWA routea aquí el tráfico HTTP/2
          AWS_LWA_INVOKE_MODE: "response_stream" # Soporte gRPC trailers y streaming
          AWS_LAMBDA_EXEC_WRAPPER: "/opt/bootstrap" # REQUERIDO para provided.al2023
          # ── Rust Engine — variables de arranque ──
          RUST_LOG: "info" # Cambiar a "debug" solo para troubleshooting
          GRPC_PORT: "9090" # Puerto interno Lambda (Function URL redirige aquí)
          CODICE_MODELS_DIR: "models" # <-- Directorio donde el Makefile empaquetó los modelos # Path relativo al binario; S3 sync en FASE 4
          ERROR_CATALOG_PATH: "errors/error_catalog.toml" # Path relativo al binario (Makefile copia config/errors → errors/)
          # ── Storage ──
          EAV_TABLE_NAME: !Ref EavTableName # Tabla EAV principal (4 GSIs)
          CEDAR_POLICIES_TABLE: !Ref MetriSchemasTable
          AWS_S3_LAKE_BUCKET: !Ref MetriDataLakeBucket
          ATHENA_WORKGROUP: !Ref AthenaWorkGroup
          # ── OLAP ──
          KINESIS_STREAM_PREFIX: "metri-olap-stream" # Naming: <prefix>-<entity-slug>
          GLUE_DATABASE_NAME: "metri_olap"
          # ── EDA ──
          OUTBOX_QUEUE_URL: !GetAtt MetriOutboxQueue.QueueUrl
          FAULT_BUS_NAME: "metri-faults"
          # ── Seguridad ──
          HMAC_SECRET_ARN: !Ref MetriHMACSecret
          HMAC_SECRET: !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}"
          METRI_BOOTSTRAP_MASTER_EMAIL: "admin@metri.one"
          METRI_BOOTSTRAP_MASTER_USERNAME: "admin"
          METRI_BOOTSTRAP_MASTER_PASSWORD: "SuperSecurePassword123!"
          # Incrementar para forzar re-deploy limpio (invalida cache de modelos en cold start)
          FORCE_DEPLOY: "1"

Outputs:
  MetriEngineFunctionPublicUrl:
    Description: "URL base del Lambda Rust (protegida por CloudFront + WAF)"
    Value: !GetAtt MetriEngineFunctionUrl.FunctionUrl
  MetriCloudFrontDomain:
    Description: "Dominio CloudFront intermedio"
    Value: !GetAtt MetriCloudFrontDistribution.DomainName
  MetriEngineCustomDomain:
    Description: "Endpoint gRPC público (Route 53 + CloudFront + WAF)"
    Value: !Sub "https://${CustomDomainName}"
  MetriEavTableArn:
    Description: "ARN de la tabla EAV principal (OLTP — Single Table Design 4 GSIs)"
    Value: !GetAtt MetriEavTable.Arn
  MetriEavTableName:
    Description: "Nombre físico de la tabla EAV"
    Value: !Ref MetriEavTable
  MetriDataLakeArn:
    Description: "ARN del lago de datos OLAP (S3 + Iceberg)"
    Value: !GetAtt MetriDataLakeBucket.Arn
  MetriGlueDatabaseName:
    Description: "Glue Database para queries Athena OLAP (Parquet/Iceberg)"
    Value: metri_olap
  MetriHMACTokenStore:
    Description: "Autenticación HMAC-SHA256 | Secret en Secrets Manager + KMS"
    Value: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:metri-hmac-secret-${AWS::StackName}"
