AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  metri-engine — Arquitectura Serverless Unificada Metri Vortex (.mbf)

  AWS SAM Template — Metri Engine (Rust / provided.al2023 ARM64 Graviton).
  Motor binario columnar-transaccional .mbf (PAX+MVCC, Grafo CSR, Series
  Temporales IoT Chimp128, Libro Mayor FixedDecimal128, Sinopsis Welford/KLL,
  Fuzzy Search SimHash+Trigram y Covarianza Cruzada) sobre Amazon S3 con CAS
  condicional (HOT_HEAD.mbf) y caché NVMe gratuita de 512 MB en /tmp.

Parameters:
  CustomDomainName:
    Type: String
    Default: engine.metri.one
    Description: "Dominio personalizado para Metri Engine en Route 53"
  HostedZoneId:
    Type: String
    Default: "Z0492322W8B6QV4SG4W4"
    Description: "ID de la Zona Hospedada en Route 53 para el dominio base"
  AcmCertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:982592308819:certificate/aadd1dab-ffed-467f-b039-43419a4b318c"
    Description: "ARN del Certificado SSL en us-east-1 (requerido para CloudFront)"
  MbfEngineMode:
    Type: String
    Default: primary
    AllowedValues:
      - primary
    Description: "Modo del motor binario Metri Vortex (.mbf): primary (S3 + /tmp NVMe)."

Globals:
  Function:
    # 30s es el techo seguro para gRPC-Web y evita ataques de Denial-of-Wallet
    # (las consultas BI sobre .mbf responden en < 25 ms).
    Timeout: 30
    # 1769 MB asigna exactamente 1.0 vCPU completa en AWS Lambda Graviton ARM64,
    # reduciendo un 15.8% el costo por milisegundo frente a 2048 MB con 100% de
    # rendimiento single-core SIMD ARM64 NEON.
    MemorySize: 1769
    EphemeralStorage:
      # 512 MB incluidos gratuitamente en cada microVM Firecracker: aloja
      # HOT_HEAD.mbf, índices .mbf.idx y slices inmutables L1/L2 en NVMe local.
      Size: 512

Resources:
  # ── 1. Escudo Criptográfico Zero-Trust (KMS Customer Managed Key) ────────────
  MetriKmsMasterKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "Llave Simétrica Maestra compartida para cifrar Variables de Entorno, S3 (.mbf Bucket Key), DynamoDB y SQS."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: "metri-key-policy"
        Statement:
          # Statement 1: Operaciones destructivas — exigen MFA obligatorio
          - Sid: "AllowDestructiveOpsWithMFA"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
              - "kms:DisableKey"
            Resource: "*"
            Condition:
              Bool:
                "aws:MultiFactorAuthPresent": "true"

          # Statement 2: Administración no-destructiva (compatible con CI/CD OIDC)
          - Sid: "AllowKeyAdministration"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:TagResource"
              - "kms:UntagResource"
            Resource: "*"

          # Statement 3: Delegación IAM (least privilege por rol de servicio)
          - Sid: "AllowIAMDelegation"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Decrypt"
              - "kms:Encrypt"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
              - "kms:ReEncrypt*"
              - "kms:CreateGrant"
              - "kms:ListGrants"
              - "kms:RevokeGrant"
            Resource: "*"

  MetriKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: "alias/metri-engine-cmk"
      TargetKeyId: !Ref MetriKmsMasterKey

  # ── 2. Capa Perimetral Edge (WAFv2 + CloudFront HTTP/2 + Route 53) ───────────
  # NOTA: Con la arquitectura .mbf se elimina AWSManagedRulesSQLiRuleSet (ya no
  # existe compilación SQL ni AWS Athena en el backend), reduciendo el consumo
  # de WCUs y eliminando falsos positivos en fórmulas matemáticas avanzadas.
  MetriWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: metri-engine-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: false
        MetricName: MetriWebACLMetrics
      Rules:
        # Regla 1: Filtro Protocolar — solo POST (gRPC-Web) y OPTIONS (CORS)
        - Name: MetriBlockNonGrpcMethods
          Priority: 5
          Action:
            Block: {}
          Statement:
            NotStatement:
              Statement:
                OrStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        SearchString: "POST"
                        PositionalConstraint: EXACTLY
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        SearchString: "OPTIONS"
                        PositionalConstraint: EXACTLY
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: MetriBlockNonGrpcMethodsMetrics

        # Regla 2: Rate Limiting por IP (1000 req/5min ≈ 3.3 req/s por IP)
        - Name: MetriRateLimitRule
          Priority: 10
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: MetriRateLimitRuleMetrics

        # Regla 3: IP Reputation List
        - Name: AWS-AmazonIpReputationList
          Priority: 20
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSIpReputationMetrics

        # Regla 4: Anonymous IP List (permitiendo proveedores cloud B2B)
        - Name: AWS-AWSManagedRulesAnonymousIpList
          Priority: 25
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
              ExcludedRules:
                - Name: HostingProviderIPList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSAnonymousIpMetrics

        # Regla 5: Known Bad Inputs
        - Name: AWS-KnownBadInputsRuleSet
          Priority: 30
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSKnownBadInputsMetrics

        # Regla 6: Common Rule Set (excluyendo SizeRestrictions_BODY para BulkIngest/Query batch)
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 40
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSCommonRuleSetMetrics

        # Regla 7: gRPC-Web Protocol Enforcement (Content-Type: application/grpc*)
        - Name: MetriGrpcProtocolEnforcement
          Priority: 50
          Action:
            Block: {}
          Statement:
            AndStatement:
              Statements:
                - ByteMatchStatement:
                    FieldToMatch:
                      Method: {}
                    SearchString: "POST"
                    PositionalConstraint: EXACTLY
                    TextTransformations:
                      - Priority: 0
                        Type: NONE
                - NotStatement:
                    Statement:
                      ByteMatchStatement:
                        FieldToMatch:
                          SingleHeader:
                            Name: "content-type"
                        SearchString: "application/grpc"
                        PositionalConstraint: STARTS_WITH
                        TextTransformations:
                          - Priority: 0
                            Type: LOWERCASE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: MetriGrpcProtocolEnforcementMetrics

  MetriLambdaPublicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MetriEngineFunction
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  MetriCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        WebACLId: !GetAtt MetriWebACL.Arn
        Aliases:
          - !Ref CustomDomainName
        Origins:
          - Id: MetriEngineOrigin
            DomainName:
              !Select [
                2,
                !Split ["/", !GetAtt MetriEngineFunctionUrl.FunctionUrl],
              ]
            OriginCustomHeaders:
              - HeaderName: X-Metri-Origin-Token
                HeaderValue: !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: MetriEngineOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          # CachingDisabled (Esencial para Streams/gRPC)
          CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          # Managed-AllViewerExceptHostHeader
          OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only

  MetriDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt MetriCloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  # ── 3. Almacén Binario Unificado Metri Vortex (.mbf) sobre Amazon S3 ─────────
  # Estructura de objetos en el bucket:
  #   v1/tenants/<tenant_id>/HOT_HEAD.mbf          → Estado caliente MVCC + L0 + CAS ETag
  #   v1/tenants/<tenant_id>/l1_stripes/<ulid>.mbf → Stripes compactados L1 + .mbf.idx
  #   v1/tenants/<tenant_id>/l2_stripes/<ulid>.mbf → Stripes históricos L2 (7 zonas .mbf)
  #   exports/<tenant_id>/<ulid>.csv               → Exportaciones temporales con TTL de 7d
  #
  # Optimización de Costos S3 + KMS:
  #   1. BucketKeyEnabled=true reduce >95% las llamadas KMS GenerateDataKey en PUTs CAS.
  #   2. ObjectSizeGreaterThan=131072 en la transición a GLACIER_IR garantiza que los
  #      objetos pequeños de mutación frecuente (HOT_HEAD.mbf y .mbf.idx < 128 KB)
  #      permanezcan siempre en S3 Standard sin penalización de tamaño mínimo ni
  #      sobrescritura, mientras que los stripes históricos L1/L2 (> 128 KB) pasan a
  #      Glacier Instant Retrieval (lectura en milisegundos, 68% más barato) a los 90 días.
  MetriDataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: "metri-engine"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref MetriKmsMasterKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUpload7d
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: TransitionColdMbfStripesToGlacierIR90d
            Status: Enabled
            ObjectSizeGreaterThan: 131072
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
          - Id: ExpireTemporaryExports7d
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 7

  # ── 4. Autenticación HMAC-SHA256 y Despacho EDA (SQS FIFO Outbox) ────────────
  MetriHMACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "metri-hmac-secret-${AWS::StackName}"
      Description: "Secret HMAC-SHA256 para firma de tokens Metri Engine. Rotar = invalida todos los tokens."
      KmsKeyId: !Ref MetriKmsMasterKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: false
        IncludeSpace: false

  MetriOutboxDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: metri-outbox-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      KmsMasterKeyId: !Ref MetriKmsMasterKey
      KmsDataKeyReusePeriodSeconds: 300

  MetriOutboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: metri-outbox.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      KmsMasterKeyId: !Ref MetriKmsMasterKey
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MetriOutboxDLQ.Arn
        maxReceiveCount: 3

  # ── 5. Motor Nativo Rust + Metri Vortex .mbf (provided.al2023 / ARM64) ───────
  MetriEngineFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      MemorySize: 1769 # 1.0 vCPU exacta en Graviton ARM64 (óptimo costo/rendimiento SIMD NEON)
      Timeout: 30
      EphemeralStorage:
        Size: 512 # 512 MB gratuitos en /tmp NVMe para caché de bloques .mbf y HOT_HEAD.mbf
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Layers:
        - "arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:24"

      KmsKeyArn: !GetAtt MetriKmsMasterKey.Arn
      AutoPublishAlias: live

      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

      LoggingConfig:
        LogGroup: !Ref MetriEngineLogGroup
        LogFormat: JSON

      # Políticas IAM de Mínimo Privilegio (100% .mbf sobre S3 + SQS + EventBridge + KMS)
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MetriDataLakeBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MetriOutboxQueue.QueueName
        - Statement:
            # KMS: operaciones criptográficas sobre S3 Bucket Key (.mbf) y SQS
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey*
              Resource: !GetAtt MetriKmsMasterKey.Arn

            # EDA: EventBridge (domain & fault events)
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource:
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/metri-faults"
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/metri-events"

            # HMAC Secret: cargado una vez en cold start
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref MetriHMACSecret

      Environment:
        Variables:
          ENVIRONMENT: production
          # ── Lambda Web Adapter ──
          PORT: "9090"
          AWS_LWA_INVOKE_MODE: "response_stream"
          AWS_LAMBDA_EXEC_WRAPPER: "/opt/bootstrap"
          # ── Rust Engine — variables de arranque ──
          RUST_LOG: "warn"
          GRPC_PORT: "9090"
          CODICE_MODELS_DIR: "models"
          ERROR_CATALOG_PATH: "errors/error_catalog.toml"
          # ── Motor Binario Unificado Metri Vortex (.mbf) ──
          MBF_ENGINE_MODE: !Ref MbfEngineMode
          MBF_S3_BUCKET: !Ref MetriDataLakeBucket
          MBF_S3_PREFIX: "metri-engine"
          MBF_TMP_CACHE_DIR: "/tmp/mbf_cache"
          MBF_TMP_CACHE_MAX_MB: "450"
          MBF_L0_MAX_ROWS: "4096"
          MBF_GROUP_COMMIT_WINDOW_MS: "15"
          # ── Almacenamiento Unificado S3 ──
          AWS_S3_LAKE_BUCKET: !Ref MetriDataLakeBucket
          AWS_S3_EXPORT_BUCKET: !Ref MetriDataLakeBucket
          # ── EDA ──
          OUTBOX_QUEUE_URL: !GetAtt MetriOutboxQueue.QueueUrl
          FAULT_BUS_NAME: "metri-faults"
          # ── Seguridad ──
          HMAC_SECRET_ARN: !Ref MetriHMACSecret
          HMAC_SECRET: !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}"
          METRI_BOOTSTRAP_MASTER_EMAIL: "admin@metri.one"
          METRI_BOOTSTRAP_MASTER_USERNAME: "admin"
          METRI_BOOTSTRAP_MASTER_PASSWORD: "SuperSecurePassword123!"
          FORCE_DEPLOY: "5"

  # ── 6. Observabilidad Estructurada con Retención Acotada (14 días) ───────────
  MetriEngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-metri-engine"
      RetentionInDays: 14

Outputs:
  MetriEngineFunctionPublicUrl:
    Description: "URL base del Lambda Rust ARM64 (protegida por CloudFront + WAF)"
    Value: !GetAtt MetriEngineFunctionUrl.FunctionUrl
  MetriCloudFrontDomain:
    Description: "Dominio CloudFront intermedio"
    Value: !GetAtt MetriCloudFrontDistribution.DomainName
  MetriEngineCustomDomain:
    Description: "Endpoint gRPC público (Route 53 + CloudFront + WAF)"
    Value: !Sub "https://${CustomDomainName}"
  MetriDataLakeArn:
    Description: "ARN del almacén binario unificado Metri Vortex (.mbf) en Amazon S3"
    Value: !GetAtt MetriDataLakeBucket.Arn
  MetriVortexBucketName:
    Description: "Nombre del bucket S3 para HOT_HEAD.mbf, stripes L1/L2 .mbf y exportaciones"
    Value: !Ref MetriDataLakeBucket
  MetriVortexEngineMode:
    Description: "Modo activo del motor binario Metri Vortex (.mbf)"
    Value: !Ref MbfEngineMode
  MetriHMACTokenStore:
    Description: "Autenticación HMAC-SHA256 | Secret en Secrets Manager + KMS"
    Value: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:metri-hmac-secret-${AWS::StackName}"
