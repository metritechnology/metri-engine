AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  metri-engine — Arquitectura Serverless Unificada Metri Vortex (.mbf)

  AWS SAM Template — Metri Engine (Rust / provided.al2023 ARM64 Graviton).
  Motor binario columnar-transaccional .mbf (PAX+MVCC, Grafo CSR, Series
  Temporales IoT Chimp128, Libro Mayor FixedDecimal128, Sinopsis Welford/KLL,
  Fuzzy Search SimHash+Trigram y Covarianza Cruzada) sobre Amazon S3 con CAS
  condicional (HOT_HEAD.mbf) y caché NVMe gratuita de 512 MB en /tmp.

Parameters:
  CustomDomainName:
    Type: String
    Default: engine.metri.one
    Description: "Dominio personalizado para Metri Engine en Route 53"
  HostedZoneId:
    Type: String
    Default: "Z0492322W8B6QV4SG4W4"
    Description: "ID de la Zona Hospedada en Route 53 para el dominio base"
  AcmCertificateArn:
    Type: String
    Default: "arn:aws:acm:us-east-1:982592308819:certificate/aadd1dab-ffed-467f-b039-43419a4b318c"
    Description: "ARN del Certificado SSL en us-east-1 (requerido para CloudFront)"
  MbfEngineMode:
    Type: String
    Default: primary
    AllowedValues:
      - primary
    Description: "Modo del motor binario Metri Vortex (.mbf): primary (S3 + /tmp NVMe)."
  OriginVerifyToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Secreto dedicado de borde opcional (si se deja vacío se usa MetriHMACSecret en Secrets Manager)."
  BootstrapMasterKey:
    Type: AWS::SSM::Parameter::Value<String>
    NoEcho: true
    Default: "/metri/engine/bootstrap/master-key"
    Description: "Clave única en AWS Systems Manager Parameter Store para el proceso de bootstrap del administrador maestro (usr_master)."
  MaxLambdaConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1000
    Description: "Fusible financiero opcional (ReservedConcurrentExecutions, 0 = sin reserva para cuentas con cuota base)."

Conditions:
  HasCustomOriginVerifyToken: !Not [!Equals [!Ref OriginVerifyToken, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref MaxLambdaConcurrency, 0]]

Globals:
  Function:
    # 30s es el techo seguro para gRPC-Web y evita ataques de Denial-of-Wallet
    # (las consultas BI sobre .mbf responden en < 25 ms).
    Timeout: 30
    # 1769 MB asigna exactamente 1.0 vCPU completa en AWS Lambda Graviton ARM64,
    # reduciendo un 15.8% el costo por milisegundo frente a 2048 MB con 100% de
    # rendimiento single-core SIMD ARM64 NEON.
    MemorySize: 1769
    EphemeralStorage:
      # 512 MB incluidos gratuitamente en cada microVM Firecracker: aloja
      # HOT_HEAD.mbf, índices .mbf.idx y slices inmutables L1/L2 en NVMe local.
      Size: 512

Resources:
  # ── 1. Escudo Criptográfico Zero-Trust (KMS Customer Managed Key) ────────────
  MetriKmsMasterKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "Llave Simétrica Maestra compartida para cifrar Variables de Entorno, S3 (.mbf Bucket Key), DynamoDB y SQS."
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: "metri-key-policy"
        Statement:
          # Statement 1: Operaciones destructivas — exigen MFA obligatorio
          - Sid: "AllowDestructiveOpsWithMFA"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
              - "kms:DisableKey"
            Resource: "*"
            Condition:
              Bool:
                "aws:MultiFactorAuthPresent": "true"

          # Statement 2: Administración no-destructiva (compatible con CI/CD OIDC)
          - Sid: "AllowKeyAdministration"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:TagResource"
              - "kms:UntagResource"
            Resource: "*"

          # Statement 3: Delegación IAM (least privilege por rol de servicio)
          - Sid: "AllowIAMDelegation"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Decrypt"
              - "kms:Encrypt"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
              - "kms:ReEncrypt*"
              - "kms:CreateGrant"
              - "kms:ListGrants"
              - "kms:RevokeGrant"
            Resource: "*"

  MetriKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: "alias/metri-engine-cmk"
      TargetKeyId: !Ref MetriKmsMasterKey

  # ── 2. Capa Perimetral Edge (WAFv2 + CloudFront HTTP/2 + Route 53) ───────────
  # NOTA: Con la arquitectura .mbf se elimina AWSManagedRulesSQLiRuleSet (ya no
  # existe compilación SQL ni AWS Athena en el backend), reduciendo el consumo
  # de WCUs y eliminando falsos positivos en fórmulas matemáticas avanzadas.
  MetriWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: metri-engine-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        # Métrica 1 de 2 activas ($0.30/mes): visibilidad global de bloqueos y alertas DDoS
        CloudWatchMetricsEnabled: true
        MetricName: MetriWebACLMetrics
      Rules:
        # Regla 1 (Unificada Zero-Trust): Contrato estricto gRPC-Web + Ruta /metri.* normalizada
        # + Validación de formato de token mk_ (>60B).
        # Fusiona MetriBlockNonGrpcMethods + MetriGrpcProtocolEnforcement (-$1.00/mes)
        # y evita invocaciones Lambda sin token o hacia /grpc.reflection.
        - Name: MetriGrpcZeroTrustGate
          Priority: 1
          Action:
            Block: {}
          Statement:
            NotStatement:
              Statement:
                AndStatement:
                  Statements:
                    # 1. Solo rutas de servicios gRPC registrados (/metri.*), previniendo ../
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        SearchString: "/metri."
                        PositionalConstraint: STARTS_WITH
                        TextTransformations:
                          - Priority: 0
                            Type: URL_DECODE
                          - Priority: 1
                            Type: NORMALIZE_PATH
                    # 2. O es preflight OPTIONS, o es POST gRPC con token mk_ (>60 bytes)
                    - OrStatement:
                        Statements:
                          - ByteMatchStatement:
                              FieldToMatch:
                                Method: {}
                              SearchString: "OPTIONS"
                              PositionalConstraint: EXACTLY
                              TextTransformations:
                                - Priority: 0
                                  Type: NONE
                          - AndStatement:
                              Statements:
                                - ByteMatchStatement:
                                    FieldToMatch:
                                      Method: {}
                                    SearchString: "POST"
                                    PositionalConstraint: EXACTLY
                                    TextTransformations:
                                      - Priority: 0
                                        Type: NONE
                                - ByteMatchStatement:
                                    FieldToMatch:
                                      SingleHeader:
                                        Name: "content-type"
                                    SearchString: "application/grpc"
                                    PositionalConstraint: STARTS_WITH
                                    TextTransformations:
                                      - Priority: 0
                                        Type: LOWERCASE
                                - OrStatement:
                                    Statements:
                                      - AndStatement:
                                          Statements:
                                            - ByteMatchStatement:
                                                FieldToMatch:
                                                  SingleHeader:
                                                    Name: "sid"
                                                SearchString: "mk_"
                                                PositionalConstraint: STARTS_WITH
                                                TextTransformations:
                                                  - Priority: 0
                                                    Type: COMPRESS_WHITE_SPACE
                                            - SizeConstraintStatement:
                                                FieldToMatch:
                                                  SingleHeader:
                                                    Name: "sid"
                                                ComparisonOperator: GT
                                                Size: 60
                                                TextTransformations:
                                                  - Priority: 0
                                                    Type: NONE
                                      - AndStatement:
                                          Statements:
                                            - ByteMatchStatement:
                                                FieldToMatch:
                                                  SingleHeader:
                                                    Name: "authorization"
                                                SearchString: "mk_"
                                                PositionalConstraint: CONTAINS
                                                TextTransformations:
                                                  - Priority: 0
                                                    Type: NONE
                                            - SizeConstraintStatement:
                                                FieldToMatch:
                                                  SingleHeader:
                                                    Name: "authorization"
                                                ComparisonOperator: GT
                                                Size: 60
                                                TextTransformations:
                                                  - Priority: 0
                                                    Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: MetriGrpcZeroTrustGateMetrics

        # Regla 2: IP Reputation List ($0/mes - bloquea botnets conocidas antes del Rate Limit)
        - Name: AWS-AmazonIpReputationList
          Priority: 10
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSIpReputationMetrics

        # Regla 3: Anonymous IP List ($0/mes - bloquea Tor/Proxies permitiendo proveedores cloud B2B)
        - Name: AWS-AWSManagedRulesAnonymousIpList
          Priority: 15
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAnonymousIpList
              ExcludedRules:
                - Name: HostingProviderIPList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSAnonymousIpMetrics

        # Regla 4: Rate Limiting por IP (1000 req/5min ≈ 3.3 req/s sobre tráfico ya filtrado)
        - Name: MetriRateLimitRule
          Priority: 20
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            # Métrica 2 de 2 activas ($0.30/mes): detección y alarma de abuso/fuerza bruta por IP
            CloudWatchMetricsEnabled: true
            MetricName: MetriRateLimitRuleMetrics

        # Regla 5: Known Bad Inputs ($0/mes bajo 1500 WCU)
        - Name: AWS-KnownBadInputsRuleSet
          Priority: 30
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSKnownBadInputsMetrics

        # Regla 6: Common Rule Set ($0/mes bajo 1500 WCU — protege contra SSRF y Stored XSS,
        # excluyendo SizeRestrictions_BODY y GenericRFI_BODY para payloads binarios Protobuf)
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 40
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ExcludedRules:
                - Name: SizeRestrictions_BODY
                - Name: GenericRFI_BODY
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: false
            MetricName: AWSCommonRuleSetMetrics

  # Cortocircuito CORS Preflight en CloudFront Edge (<0.5ms, 2M req/mes gratis, 0 invocaciones Lambda)
  MetriCorsPreflightFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-cors-preflight"
      AutoPublish: true
      FunctionConfig:
        Comment: "Responde OPTIONS CORS en el borde con Max-Age 24h sin despertar la Lambda Rust"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.method === 'OPTIONS') {
            var reqOrigin = request.headers['origin'] ? request.headers['origin'].value : '';
            var allowedOrigin = 'https://app.metri.one';
            if (
              reqOrigin === 'https://metri.one' ||
              reqOrigin.endsWith('.metri.one') ||
              reqOrigin.startsWith('http://localhost:') ||
              reqOrigin.startsWith('http://127.0.0.1:')
            ) {
              allowedOrigin = reqOrigin;
            }
            return {
              statusCode: 204,
              statusDescription: 'No Content',
              headers: {
                'access-control-allow-origin': { value: allowedOrigin },
                'access-control-allow-methods': { value: 'POST, OPTIONS' },
                'access-control-allow-headers': { value: 'content-type, x-grpc-web, x-user-agent, authorization, sid, grpc-timeout, x-metri-origin-token' },
                'access-control-expose-headers': { value: 'grpc-status, grpc-message, grpc-status-details-bin' },
                'access-control-max-age': { value: '86400' },
                'vary': { value: 'Origin' }
              }
            };
          }
          return request;
        }

  MetriLambdaPublicPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref MetriEngineFunction
      FunctionUrlAuthType: NONE
      Action: lambda:InvokeFunctionUrl
      Principal: "*"

  MetriCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        WebACLId: !GetAtt MetriWebACL.Arn
        Aliases:
          - !Ref CustomDomainName
        Origins:
          - Id: MetriEngineOrigin
            DomainName:
              !Select [
                2,
                !Split ["/", !GetAtt MetriEngineFunctionUrl.FunctionUrl],
              ]
            OriginCustomHeaders:
              - HeaderName: X-Metri-Origin-Token
                HeaderValue:
                  !If [
                    HasCustomOriginVerifyToken,
                    !Ref OriginVerifyToken,
                    !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}",
                  ]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: MetriEngineOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          # CachingDisabled (Esencial para Streams/gRPC)
          CachePolicyId: "4135ea2d-6df8-44a3-9df3-4b5a84be39ad"
          # Managed-AllViewerExceptHostHeader
          OriginRequestPolicyId: "b689b0a8-53d0-40ab-baf2-68738e2966ac"
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt MetriCorsPreflightFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only

  MetriDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt MetriCloudFrontDistribution.DomainName
        EvaluateTargetHealth: false

  # ── 3. Almacén Binario Unificado Metri Vortex (.mbf) sobre Amazon S3 ─────────
  # Estructura de objetos en el bucket:
  #   v1/tenants/<tenant_id>/HOT_HEAD.mbf          → Estado caliente MVCC + L0 + CAS ETag
  #   v1/tenants/<tenant_id>/l1_stripes/<ulid>.mbf → Stripes compactados L1 + .mbf.idx
  #   v1/tenants/<tenant_id>/l2_stripes/<ulid>.mbf → Stripes históricos L2 (7 zonas .mbf)
  #   exports/<tenant_id>/<ulid>.csv               → Exportaciones temporales con TTL de 7d
  #
  # Optimización de Costos S3 + KMS:
  #   1. BucketKeyEnabled=true reduce >95% las llamadas KMS GenerateDataKey en PUTs CAS.
  #   2. ObjectSizeGreaterThan=131072 en la transición a GLACIER_IR garantiza que los
  #      objetos pequeños de mutación frecuente (HOT_HEAD.mbf y .mbf.idx < 128 KB)
  #      permanezcan siempre en S3 Standard sin penalización de tamaño mínimo ni
  #      sobrescritura, mientras que los stripes históricos L1/L2 (> 128 KB) pasan a
  #      Glacier Instant Retrieval (lectura en milisegundos, 68% más barato) a los 90 días.
  MetriDataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: "metri-engine"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref MetriKmsMasterKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUpload7d
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: TransitionColdMbfStripesToGlacierIR90d
            Status: Enabled
            ObjectSizeGreaterThan: 131072
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
          - Id: ExpireTemporaryExports7d
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 7

  # ── 4. Autenticación HMAC-SHA256 y Despacho EDA (SQS FIFO Outbox) ────────────
  MetriHMACSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "metri-hmac-secret-${AWS::StackName}"
      Description: "Secret HMAC-SHA256 para firma de tokens Metri Engine. Rotar = invalida todos los tokens."
      KmsKeyId: !Ref MetriKmsMasterKey
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: false
        IncludeSpace: false

  MetriOutboxDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: metri-outbox-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      KmsMasterKeyId: !Ref MetriKmsMasterKey
      KmsDataKeyReusePeriodSeconds: 300

  MetriOutboxQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: metri-outbox.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      KmsMasterKeyId: !Ref MetriKmsMasterKey
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MetriOutboxDLQ.Arn
        maxReceiveCount: 3

  # ── 5. Motor Nativo Rust + Metri Vortex .mbf (provided.al2023 / ARM64) ───────
  MetriEngineFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      MemorySize: 1769 # 1.0 vCPU exacta en Graviton ARM64 (óptimo costo/rendimiento SIMD NEON)
      Timeout: 30
      ReservedConcurrentExecutions:
        !If [HasReservedConcurrency, !Ref MaxLambdaConcurrency, !Ref "AWS::NoValue"]
      EphemeralStorage:
        Size: 512 # 512 MB gratuitos en /tmp NVMe para caché de bloques .mbf y HOT_HEAD.mbf
      CodeUri: .
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures:
        - arm64
      Layers:
        - "arn:aws:lambda:us-east-1:753240598075:layer:LambdaAdapterLayerArm64:24"

      KmsKeyArn: !GetAtt MetriKmsMasterKey.Arn
      AutoPublishAlias: live

      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

      LoggingConfig:
        LogGroup: !Ref MetriEngineLogGroup
        LogFormat: JSON

      # Políticas IAM de Mínimo Privilegio (100% .mbf sobre S3 + SQS + EventBridge + KMS)
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref MetriDataLakeBucket
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MetriOutboxQueue.QueueName
        - Statement:
            # KMS: operaciones criptográficas sobre S3 Bucket Key (.mbf) y SQS
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:Encrypt
                - kms:GenerateDataKey*
              Resource: !GetAtt MetriKmsMasterKey.Arn

            # EDA: EventBridge (domain & fault events)
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource:
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/metri-faults"
                - !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/metri-events"

            # Secretos de seguridad y clave única de bootstrap (SSM Parameter Store)
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref MetriHMACSecret
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/metri/engine/bootstrap/*"

      Environment:
        Variables:
          ENVIRONMENT: production
          # ── Lambda Web Adapter ──
          PORT: "9090"
          AWS_LWA_INVOKE_MODE: "response_stream"
          AWS_LAMBDA_EXEC_WRAPPER: "/opt/bootstrap"
          # ── Rust Engine — variables de arranque ──
          RUST_LOG: "warn"
          GRPC_PORT: "9090"
          CODICE_MODELS_DIR: "models"
          ERROR_CATALOG_PATH: "errors/error_catalog.toml"
          # ── Motor Binario Unificado Metri Vortex (.mbf) ──
          MBF_ENGINE_MODE: !Ref MbfEngineMode
          MBF_S3_BUCKET: !Ref MetriDataLakeBucket
          MBF_S3_PREFIX: "metri-engine"
          MBF_TMP_CACHE_DIR: "/tmp/mbf_cache"
          MBF_TMP_CACHE_MAX_MB: "450"
          MBF_L0_MAX_ROWS: "4096"
          MBF_GROUP_COMMIT_WINDOW_MS: "15"
          # ── Almacenamiento Unificado S3 ──
          AWS_S3_LAKE_BUCKET: !Ref MetriDataLakeBucket
          AWS_S3_EXPORT_BUCKET: !Ref MetriDataLakeBucket
          # ── EDA ──
          OUTBOX_QUEUE_URL: !GetAtt MetriOutboxQueue.QueueUrl
          FAULT_BUS_NAME: "metri-faults"
          # ── Seguridad ──
          ORIGIN_VERIFY_TOKEN:
            !If [
              HasCustomOriginVerifyToken,
              !Ref OriginVerifyToken,
              !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}",
            ]
          HMAC_SECRET_ARN: !Ref MetriHMACSecret
          HMAC_SECRET: !Sub "{{resolve:secretsmanager:${MetriHMACSecret}:SecretString}}"
          METRI_BOOTSTRAP_MASTER_EMAIL: "admin@metri.one"
          METRI_BOOTSTRAP_MASTER_USERNAME: "admin"
          METRI_BOOTSTRAP_MASTER_KEY: !Ref BootstrapMasterKey
          FORCE_DEPLOY: "10"

  # ── 6. Observabilidad Estructurada con Retención Acotada (14 días) ───────────
  MetriEngineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-metri-engine"
      RetentionInDays: 14

Outputs:
  MetriCloudFrontDomain:
    Description: "Dominio CloudFront intermedio"
    Value: !GetAtt MetriCloudFrontDistribution.DomainName
  MetriEngineCustomDomain:
    Description: "Endpoint gRPC público (Route 53 + CloudFront + WAF)"
    Value: !Sub "https://${CustomDomainName}"
  MetriDataLakeArn:
    Description: "ARN del almacén binario unificado Metri Vortex (.mbf) en Amazon S3"
    Value: !GetAtt MetriDataLakeBucket.Arn
  MetriVortexBucketName:
    Description: "Nombre del bucket S3 para HOT_HEAD.mbf, stripes L1/L2 .mbf y exportaciones"
    Value: !Ref MetriDataLakeBucket
  MetriVortexEngineMode:
    Description: "Modo activo del motor binario Metri Vortex (.mbf)"
    Value: !Ref MbfEngineMode
  MetriHMACTokenStore:
    Description: "Autenticación HMAC-SHA256 | Secret en Secrets Manager + KMS"
    Value: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:metri-hmac-secret-${AWS::StackName}"
  MetriBootstrapParameterStoreKey:
    Description: "ARN del parámetro SSM con la clave única de bootstrap del administrador maestro"
    Value: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/metri/engine/bootstrap/master-key"
