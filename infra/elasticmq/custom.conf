# ElasticMQ — SQS FIFO compatible configuration
# Documentación: https://github.com/softwaremill/elasticmq
#
# Este archivo define las colas pre-creadas al arrancar ElasticMQ.
# Equivale a los scripts init de LocalStack pero sin I/O externo.

include classpath("application.conf")

node-address {
  protocol = http
  host     = "*"
  port     = 9324
  context-path = ""
}

rest-sqs {
  enabled    = true
  bind-port  = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# Colas pre-configuradas (equivalente a los scripts init)
queues {
  # DLQ primero — referenciada por la cola principal
  "metri-outbox-dlq.fifo" {
    defaultVisibilityTimeout = 10 seconds
    delay                    = 0 seconds
    receiveMessageWait       = 0 seconds
    fifo                     = true
    contentBasedDeduplication = true
    tags {
      project = "metri-engine"
      env     = "local"
    }
  }

  # Cola principal Outbox con RedrivePolicy hacia DLQ
  "metri-outbox.fifo" {
    defaultVisibilityTimeout = 30 seconds
    delay                    = 0 seconds
    receiveMessageWait       = 0 seconds
    fifo                     = true
    contentBasedDeduplication = true
    deadLettersQueue {
      name           = "metri-outbox-dlq.fifo"
      maxReceiveCount = 3
    }
    tags {
      project = "metri-engine"
      env     = "local"
    }
  }
}
