syntax = "proto3";

package metri.auth;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "metri.auth.pb";
option java_outer_classname = "SessionProto";
option go_package = "github.com/metri/metri-auth/pkg/session/pb";

/**
 * Session: The binary representation of a verified user session in Valkey/Redis.
 * Designed for microsecond-level deserialization in Metri Engine (Clojure/JVM).
 */
message Session {
  // Session Identifiers
  string sid = 1; // Session ID (Key in Redis)
  string kid = 2; // Key ID for cryptographic context
  
  // Identity Context
  string user_id = 3; 
  string tenant_id = 4;
  string username = 5;
  
  // Authorization Context
  repeated string roles = 6;
  map<string, string> claims = 7; // Extensible metadata
  
  // Audit & Lifecycle
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp expires_at = 9;
  
  // Optional Security Context (Audit)
  string login_ip = 10;
  string user_agent = 11;
}
