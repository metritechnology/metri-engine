# Metri Engine — Error Catalog v2.0.0
# Única fuente de verdad para todos los códigos de error del motor.
# Formato: TOML (nativo Rust — leído en bootstrap por ErrorRegistry).
# PROHIBIDO definir códigos fuera de este archivo.
# El motor NO acepta requests hasta que todos los entries pasen validación.

version      = "3.0.0"
generated_at = "2026-09-07"
# v3.0.0 (PLAN_PATRON_RESULT.md §3.2): reparación 1:1 — una variante ErrorCode
# = un código canónico = una entrada. Códigos sin variante: reserved/deprecated.
description  = "Catálogo canónico de errores de Metri Engine — Rust Native"

