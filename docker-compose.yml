version: "3.8"

# ══════════════════════════════════════════════════════════════════════════════
#  Metri Engine — Stack Local de Simulación (100% Free, Zero-Cost)
#  Sin LocalStack Pro · Sin auth tokens · Solo imágenes oficiales abiertas
#
#  Infraestructura:
#    - DynamoDB Local  (amazon/dynamodb-local) → Puerto 8000
#    - MinIO           (minio/minio)           → Puerto 9000 / 9001 (consola)
#    - ElasticMQ       (softwaremill/elasticmq) → Puerto 9324 (SQS FIFO)
#    - Valkey 7.2      (valkey/valkey)         → Puerto 6379
#
#  Servidor gRPC:
#    - metri-engine   (JVM Clojure / Netty)    → Puerto 9090 (gRPC nativo)
#      Endpoint para pruebas: localhost:9090
#      grpcurl: grpcurl -plaintext localhost:9090 list
#
#  Uso:
#    ./scripts/local/start.sh       ← levanta infra + servidor gRPC
#    ./scripts/local/start-infra.sh ← solo infraestructura (sin engine)
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── DynamoDB Local (Oficial AWS) — OLTP Datahike + Schemas + Quota ───────
  # Imagen oficial de Amazon — gratuita, sin restricciones, sin token
  # Documentación: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBLocal.html
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: metri-dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8000 | grep -qE '^(200|400|301|302)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MinIO — S3 Compatible (Data Lake local) ───────────────────────────────
  # 100% compatible con AWS SDK v2, protocolo S3 idéntico
  # Consola web: http://localhost:9001 (admin / adminadmin)
  minio:
    image: minio/minio:latest
    container_name: metri-minio
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── MinIO Init — Crea los buckets necesarios al arrancar ──────────────────
  minio-init:
    image: minio/mc:latest
    container_name: metri-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/metri-lake-local;
        mc mb --ignore-existing local/metri-athena-results-local;
        echo 'MinIO buckets creados OK';
      "

  # ── ElasticMQ — SQS FIFO Compatible (Outbox EDA) ─────────────────────────
  # 100% compatible con AWS SQS API (incluyendo FIFO + DeduplicationId)
  # Configuración: custom.conf montado en el contenedor
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: metri-elasticmq
    ports:
      - "9324:9324"   # SQS endpoint
      - "9325:9325"   # Web UI (opcional)
    volumes:
      - "./infra/elasticmq/custom.conf:/opt/elasticmq.conf"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9325"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Valkey 7.2 — Session Store & Autorizador Zero-Trust ──────────────────
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: metri-valkey-local
    ports:
      - "6379:6379"
    command: >
      valkey-server
      --save ""
      --appendonly no
      --loglevel warning
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ── DynamoDB Init — Crea tablas necesarias ────────────────────────────────
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: metri-dynamodb-init
    depends_on:
      dynamodb-local:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: |
      /bin/sh -c "
        echo '>>> Creando tablas DynamoDB...';

        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name metri-datahike-local --attribute-definitions AttributeName=Key,AttributeType=S --key-schema AttributeName=Key,KeyType=HASH --billing-mode PAY_PER_REQUEST 2>/dev/null || echo '[SKIP] metri-datahike-local ya existe';

        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name metri-schemas-local --attribute-definitions AttributeName=PK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH --billing-mode PAY_PER_REQUEST 2>/dev/null || echo '[SKIP] metri-schemas-local ya existe';

        aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name metri-quota-local --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE --billing-mode PAY_PER_REQUEST 2>/dev/null || echo '[SKIP] metri-quota-local ya existe';

        echo '>>> DynamoDB listo.';
      "

  # ── Metri Engine — Servidor gRPC Netty (Puerto 9090) ────────────────────
  # Proceso JVM Clojure que corre metri.main/-main
  # Requiere: clj -T:build uber (genera target/metri-engine.jar)
  # Endpoint gRPC: localhost:9090
  # Reflection habilitada en local → grpcurl -plaintext localhost:9090 list
  metri-engine:
    image: eclipse-temurin:21-jre-alpine
    container_name: metri-engine-grpc
    ports:
      - "9090:9090"    # gRPC Netty — endpoint principal para pruebas
    working_dir: /app
    volumes:
      - ./target:/app/target  # uberjar compilado localmente
      - ~/.aws:/root/.aws:ro  # montar credenciales reales de AWS
    command: ["java", "-jar", "/app/target/metri-engine.jar"]
    environment:
      ENVIRONMENT: local
      GRPC_PORT: "9090"
      GRPC_REFLECTION_ENABLED: "true"   # habilita grpcurl list/describe

      # La región es necesaria para el AWS SDK Java
      AWS_REGION: us-east-1
      AWS_PROFILE: metri-dev

      # DynamoDB Local
      DATAHIKE_STORE_URI: "datahike:dynamodb://us-east-1/metri-datahike-local"
      DATAHIKE_DDB_TABLE: "metri-datahike-local"
      DATAHIKE_ENDPOINT:  "http://dynamodb-local:8000"
      METRI_SCHEMAS_TABLE: "metri-schemas-local"
      DYNAMODB_QUOTA_TABLE: "metri-quota-local"
      DYNAMODB_ENDPOINT:    "http://dynamodb-local:8000"

      # MinIO S3
      AWS_S3_LAKE_BUCKET: "metri-lake-local"
      S3_ENDPOINT:        "http://minio:9000"
      S3_ACCESS_KEY:      "minioadmin"
      S3_SECRET_KEY:      "minioadmin"

      # ElasticMQ SQS
      METRI_OUTBOX_QUEUE: "http://elasticmq:9324/000000000000/metri-outbox.fifo"
      SQS_ENDPOINT:       "http://elasticmq:9324"

      # Valkey
      VALKEY_HOST:     valkey
      VALKEY_PORT:     "6379"
      VALKEY_PASSWORD: ""
      VALKEY_SSL:      "false"

      # Stubs OLAP (Athena/Kinesis/EventBridge via system.dev.edn)
      ATHENA_ENDPOINT:  "STUB"
      ATHENA_WORKGROUP: "primary"
    depends_on:
      dynamodb-local:
        condition: service_healthy
      minio:
        condition: service_started
      elasticmq:
        condition: service_started
      valkey:
        condition: service_healthy
    profiles:
      - grpc   # solo se levanta con: docker compose --profile grpc up
    healthcheck:
      test: ["CMD-SHELL", "grpcurl -plaintext localhost:9090 grpc.health.v1.Health/Check || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  dynamodb-data:
    driver: local
  minio-data:
    driver: local
