# Única dependencia externa del desarrollo local: DynamoDB Local.
# Las tablas (metri-eav/schemas/quota-local) las crea scripts/dev/reset_local.py.
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    user: root
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - "dynamodb_data:/data"

volumes:
  dynamodb_data:
