syntax = "proto3";

import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_package = "metri.data.grpc";
option java_outer_classname = "MetriProto";

package metri;

/**
 * MetriService: The unified gRPC interface for the Metri Data Platform.
 * 
 * Organized into three logical domains:
 * 1. Metadata: Registry discovery and schema exploration.
 * 2. Analytics: High-performance querying, batching, and semantic analysis.
 * 3. Operations: Transactional CRUD and bulk ingestion.
 */
service MetriService {
  // --- Metadata Domain ---
  rpc Discovery(DiscoveryRequest) returns (stream DiscoveryResponse);
  rpc Explore(ExploreRequest) returns (stream ExploreResponse);

  // --- Analytics Domain ---
  // The Universal Query Engine: Handles 1 query, Batch dashboards, or Multi-Series merged charts.
  // Returns a stream to enable low-latency rendering of large result sets.
  rpc Query(QueryRequest) returns (stream QueryResponse);

  // --- Operations Domain ---
  rpc Transact(TransactionRequest) returns (TransactionResponse);
  rpc BulkIngest(BulkRequest) returns (BulkResponse);

  // --- EDA (Event-Driven Architecture) Domain ---
  // High-Performance Batch Router for O(1) Network Hopping
  // Exclusive bridge for the SAM Event Router to evaluate AST logic inversely for arrays of SQS records.
  rpc MatchRoutingRulesBatch(MatchRoutingRulesBatchRequest) returns (MatchRoutingRulesBatchResponse);
}

// =============================================================================
// BASE MESSAGES (Hypermedia & Status)
// =============================================================================

// Common response wrapper to indicate success or failure.
message Status {
  bool success = 1;
  // Canonical DSL / validation errors:
  // - DSL_SYNTAX_ERROR
  // - TYPE_MISMATCH
  // - DSL_SECURITY_VIOLATION
  // - DSL_DEPTH_LIMIT
  // - OUTPUT_CAST_VIOLATION
  string error_code = 2;
  string error_message = 3;
}

// HATEOAS Link definition for discoverable APIs.
message Link {
  string rel = 1;
  string href = 2;
  string method = 3; // GET, POST, etc.
}

// UI Action definition for HATEOAS-driven interfaces.
message Action {
  string id = 1;
  string label = 2;
  string icon = 3;
  Link link = 4;
  string type = 5; // "primary", "error", "warning"
}

// Standardized Keyset Pagination metadata.
// Opaque cursors ensure O(log N) resumability and prevent page-drifting on concurrent writes.
message Pagination {
  string next_cursor     = 1; // Encoded token for the next page pointer (Index-Range)
  string previous_cursor = 2; // Encoded token for the backward page pointer
  int32 page_size        = 3; // Number of items requested/returned
  bool has_next          = 4; // Indicator for UI "Load More" actions
  bool has_previous      = 5;
  repeated Link links    = 6; // first, last, next, prev
}

// =============================================================================
// METADATA MESSAGES (Discovery)
// =============================================================================

message DiscoveryRequest {
  string tenant_id = 1;

  // Optional filter: return only schemas matching this entity name.
  // Empty string = return all entities registered in the Codex for this tenant.
  string type = 2;

  // Performance optimization: if false, return only EntitySchema metadata
  // without AttributeSchema[] children. Useful for sidebar navigation.
  bool include_attributes = 3;

  // Keyset cursor for paginated Codex discovery (large multitenant catalogs).
  string cursor = 4;

  // Max entities per page (default: 50, max: 200).
  int32 page_size = 5;
}

message AttributeSchema {
  // ── Core Identity ─────────────────────────────────────────────────────────
  // Codex attribute name (Clojure namespace key: :entity/name)
  string name = 1;

  // Primitive type: "string", "number", "boolean", "date", "uuid", "json"
  string type = 2;

  // Secondary type qualifier: "enum", "currency", "percentage", "relative_time"
  string subtype = 3;

  // ── Relational ────────────────────────────────────────────────────────────
  // For enum/select attributes: the allowed discrete values.
  // Replaces legacy `options` field for semantic clarity.
  repeated string enum_values = 4;

  // For UUID attributes pointing to a related entity (join reference).
  string entity_ref = 5;

  // Default value rendered by the UI form when creating a new record.
  string default_value = 6;

  // ── Search & Indexing ─────────────────────────────────────────────────────
  // FTS (Full Text Search) Flag.
  // If true, Hermes dynamically injects this attribute into the "Omnisearch" OR tree
  // for Fuzzy matching (Levenshtein on OLAP or Lucene on OLTP).
  bool fts = 7;

  // ── UI Rendering Hints ────────────────────────────────────────────────────
  // Human-readable label rendered in the UI (e.g. "Work Order Status").
  string label = 8;

  // UI icon identifier (mdi: prefix for Material Design, e.g. "mdi:tag").
  string icon = 9;

  // SI unit suffix displayed in the UI (e.g. "USD", "%", "kWh", "°C").
  string unit = 10;

  // ── Query Capabilities ───────────────────────────────────────────────────
  // Janus DSL gate: if false, FilterCriteria using this attribute is rejected.
  bool filterable = 11;

  // Janus DSL gate: if false, ORDER BY on this attribute is rejected.
  bool sortable = 12;

  // Janus DSL gate: if false, GROUP BY on this attribute is rejected.
  bool groupable = 13;

  // Janus DSL gate: if false, aggregate functions (SUM/AVG/COUNT) are rejected.
  bool aggregatable = 14;
}

message EntitySchema {
  // ── Core Identity ─────────────────────────────────────────────────────────
  // Codex entity name (Clojure namespace: :work_order, :asset, :location).
  string entity = 1;

  // Full hydrated attribute list. Omitted when DiscoveryRequest.include_attributes=false.
  repeated AttributeSchema attributes = 2;

  // ── UI Rendering Hints ────────────────────────────────────────────────────
  // Human-readable label for UI headers/breadcrumbs (e.g. "Work Order").
  string label = 3;

  // UI icon identifier (mdi: prefix, e.g. "mdi:clipboard-check").
  string icon = 4;

  // ── Record Identity ───────────────────────────────────────────────────────
  // The attribute name used as the primary key in RowSet results (typically "id").
  string primary_key = 5;

  // ── Full Text Search ──────────────────────────────────────────────────────
  // Ordered list of attribute names fed to the Omnisearch OR tree.
  // Hermes uses this to build the Levenshtein/Lucene composite query.
  repeated string fts_fields = 6;

  // ── Pagination ────────────────────────────────────────────────────────────
  // Estimated total entities in Codex for this tenant (used by UI for skeleton rendering).
  int64 total_count = 7;
}

message DiscoveryResponse {
  Status status = 1;
  repeated EntitySchema schemas = 2; // Flat list of entities and their root attributes
  // Keyset cursor for the next page (empty if this is the last page).
  string next_cursor = 3;
  bool has_next = 4;
}

message ExploreRequest {
  string tenant_id = 1;
  string entity = 2;
  string attribute = 3;
  int32 limit = 4;
}

message ExploreResponse {
  Status status = 1;
  repeated string values = 2;
}

// =============================================================================
// ANALYTICAL MESSAGES (Query Engine)
// =============================================================================

// Agnostic Statistical & Machine Learning Aggregations
// Instructs the backend to perform mathematical reductions.
// The Clojure backend is agnostic and will compile these directives to:
// - Trino/Athena: Pushdown columnar functions (e.g., `CORR()`, `REGR_SLOPE()`)
// - Datomic/Clojure: In-memory JVM math reductions via Transducers.
enum AggregationFunction {
  // Safe default — Janus rechaza MetricDefinition con este valor via :JANUS_400.
  // proto3 best-practice: el valor 0 SIEMPRE debe ser un sentinel no-op.
  AGGREGATION_FUNCTION_UNSPECIFIED = 0;

  // Descriptive Math
  COUNT = 1;
  SUM = 2;
  AVG = 3;
  MIN = 4;
  MAX = 5;
  
  // Advanced Statistics
  MEDIAN = 6;
  STD_DEV = 7;       // Standard Deviation
  VARIANCE = 8;
  PERCENTILE_90 = 9;
  PERCENTILE_95 = 10;
  PERCENTILE_99 = 11;
  
  // Predictive ML / Bivariate
  CORRELATION = 12;       // Pearson Correlation (requires a secondary `attribute` in measures)
  LINEAR_REGRESSION = 13; // Outputs the slope for forecasting
  LOGISTIC_REGRESSION = 14; // Output probability models
}

// Self-describing metric: carries its own entity (domain) and attribute.
// The backend derives the query domain from this structure.
message MetricDefinition {
  string entity    = 1; // Entity domain, e.g. "asset", "work_order"
  string attribute = 2; // Attribute name within that entity, e.g. "id", "total_cost"
  AggregationFunction aggregation = 3; // Engine-agnostic math operator
  string name      = 4; // Optional label for the resulting dataset
  
  // Secondary attribute for bivariate analysis (e.g. CORRELATION, LINEAR_REGRESSION)
  // Required only if the aggregation function specifically needs two sources.
  string secondary_attribute = 5;
  // Optional local filter for this metric (v3 EDN contract parity).
  FilterNode filter = 6;
  // Optional metric interval override (e.g. "day", "week", "month").
  string interval = 7;
}

// Optional dimension (x-axis / grouping).
// ==========================================
// TIME-SERIES SUPPORT (Polymorphic Gap-Filling):
// If the `interval` field is provided (e.g. "hour", "day", "week", "month"), the engine 
// will trigger true Time-Series analytics. 
// - In OLAP, it compiles to DATE_TRUNC push-down predicates.
// - In OLTP, it compiles to Transducer-based epoch bucketing in Clojure.
// The orchestrator automatically applies "Gap-Filling" to ensure continuous UI renderings.
// CRITICAL MATH CONSTRAINT: It does NOT blindly inject 0s. 
// It injects `0` for additive aggregations (SUM, COUNT).
// It injects `NULL` for statistical functions (AVG, MIN, MAX) delegating regressions to the frontend.
// ==========================================
message DimensionDefinition {
  string entity    = 1; // Entity domain for the dimension
  string attribute = 2; // Attribute to group by
  string interval  = 3; // Optional time interval: "day", "week", "month", etc.

  // Label Template — Mustache-style interpolation for data-point labels.
  // Supports: {{attribute_name}} placeholders resolved against each data row.
  // Example: "{{asset_name}} - {{area_value}} KW"
  // If empty, the engine uses the raw attribute value as the label.
  // Applies to: PIE slice names, LINE/AREA series legends, TABLE cell display.
  string label_template = 4;
}


message FormulaEntry {
  string name = 1;
  string formula = 2;
}

// 1. CAPA SEMÁNTICA "LOOKML"
// Referencia a una métrica predefinida y auditada que reside permanentemente en el servidor
// (ej. "Global_Gross_Margin"). Evita la inyección repetitiva de fórmulas de Frontends dispares.
message SemanticMetricRef {
  string metric_key = 1;
}

message StringList {
  repeated string values = 1;
}

message FilterValueList {
  repeated FilterValue values = 1;
}

message FilterValue {
  oneof kind {
    string string_val = 1;
    double number_val = 2;
    bool bool_val = 3;
    int64 timestamp_val = 4;
    StringList list_val = 5;
    // Strongly typed range values for BETWEEN/IN operators.
    // Minimizes string casting overhead in the Java/Clojure backend for scale.
    FilterValueList range_values = 6;
  }
}

enum FilterOperator {
  // Safe default — Janus rechaza FilterCriteria con este valor via :JANUS_400.
  // Un filtro no especificado no debe ejecutar silenciosamente una comparación.
  FILTER_OPERATOR_UNSPECIFIED = 0;
  EQ          = 1;   // igualdad estricta
  NEQ         = 2;   // desigualdad
  GT          = 3;   // mayor que
  GTE         = 4;   // mayor o igual que
  LT          = 5;   // menor que
  LTE         = 6;   // menor o igual que
  IN          = 7;   // pertenece a un conjunto de valores
  NOT_IN      = 8;   // excluye un conjunto de valores (complemento de IN)
  BETWEEN     = 9;   // rango inclusivo [a, b]
  LIKE        = 10;  // patrón SQL (%, _) — búsqueda textual parcial
  IS_NULL     = 11;  // campo nulo
  IS_NOT_NULL = 12;  // campo no nulo
  MATCHES     = 13;  // expresión regular (regex)
  CONTAINS    = 14;  // contiene elemento (arrays / substring semántico)
}

message FilterCriteria {
  // Attribute name to filter on.
  //
  // Simple field: "status", "name", "area_value"
  //   → Janus validates against the entity schema and compiles to a direct predicate.
  //
  // Dot-path (cross-entity): "location_id.type", "location_id.area_value"
  //   → Janus resolves the dot-path against the Codex schema:
  //     1. The left segment (e.g. "location_id") must be a type=reference attribute.
  //     2. The right segment (e.g. "type") must exist in the referenced entity's schema.
  //     3. Arbitrary nesting is supported: "location_id.parent_location_id.type"
  //   → Compiled to engine-specific join predicates:
  //     - OLTP (Datahike): intermediate variable binding [?e :entity/ref ?ref] [?ref :ref-entity/attr val]
  //     - OLAP (Athena):   implicit JOIN via denormalized composite table columns
  //   → No proto schema change required. Standard FilterOperator and FilterValue apply.
  string field = 1;
  FilterValue value = 2;
  FilterOperator op_ref = 3;
}

message FilterGroup {
  enum Conjunction {
    CONJUNCTION_UNSPECIFIED = 0;
    AND = 1;
    OR = 2;
    NOT = 3;
  }
  Conjunction conjunction = 1;
  repeated FilterNode nodes = 2;
}

message FilterNode {
  oneof node {
    FilterCriteria criteria = 1;
    FilterGroup group = 2;
  }
}

message SortDefinition {
  string field = 1;
  bool descending = 2;
}

// =============================================================================
// ROOT TIME CONTEXT (Temporal Framing)
// =============================================================================
// Dedicated Temporal boundary manager. 
// A BI engine shouldn't rely purely on abstract `WHERE x > date` filters because
// relative comparisons (like "vs Yesterday") need to dynamically know the baseline.
message TimeFrameContext {
  enum TimeFilterType {
    TIME_FILTER_TYPE_UNSPECIFIED = 0;
    
    // Custom Static
    CUSTOM_RANGE = 1; 
    
    // Daily / Hourly
    TODAY = 2;
    YESTERDAY = 3;
    TOMORROW = 4;
    LAST_N_MINUTES = 5;
    LAST_N_HOURS = 6;
    LAST_N_DAYS = 7;
    NEXT_N_DAYS = 8;

    // Weekly
    THIS_WEEK = 9;
    LAST_WEEK = 10;
    NEXT_WEEK = 11;
    LAST_N_WEEKS = 12;
    NEXT_N_WEEKS = 13;
    WEEK_TO_DATE = 14;

    // Monthly
    THIS_MONTH = 15;
    LAST_MONTH = 16;
    NEXT_MONTH = 17;
    LAST_N_MONTHS = 18;
    NEXT_N_MONTHS = 19;
    MONTH_TO_DATE = 20;

    // Quarterly / Yearly
    THIS_QUARTER = 21;
    LAST_QUARTER = 22;
    LAST_N_QUARTERS = 23;
    QUARTER_TO_DATE = 24;
    THIS_YEAR = 25;
    LAST_YEAR = 26;
    LAST_N_YEARS = 27;
    YEAR_TO_DATE = 28;

    // Absolute
    ALL_TIME = 29;
  }
  
  // Strategies the backend will compile to Absolute Date parameters based on User's clock
  TimeFilterType type = 1;
  int32 n_value = 2;              // Required if shifting (e.g. 15 for "Last 15 days")
  int64 start_ts = 3;             // Custom Range: Exact epoch millisecond
  int64 end_ts = 4;               // Custom Range: Exact epoch millisecond
  string timezone = 5;            // Crucial BI pivot. Resolves boundaries correctly (e.g., "America/Bogota")
}

message AnalyticalComparison {
  enum ComparisonType {
    COMPARISON_TYPE_UNSPECIFIED = 0;
    // Relative Shift: If timeframe is "Last 15 days", and offset is "-1" it looks at the immediate previous 15 days automatically.
    TIME_SHIFT_RELATIVE = 1; 
    // Shortcut Shift: Exact semantic constants defined by BI standard (e.g. YESTERDAY_LAST_YEAR)
    TIME_SHIFT_SHORTCUT = 2;
    // Absolute Shift: Explicitly queries a static past window (e.g. compare "Today" vs "Last Black Friday")
    TIME_SHIFT_ABSOLUTE = 3; 
    // Benchmark: Compares the metric output against a mathematical static threshold or overall system average.
    BENCHMARK = 4;           
    // Smart: Automatically performs anomaly detection (Gaussian distribution) across the data history
    SMART = 5;               
  }
  
  enum ShiftShortcut {
    SHIFT_SHORTCUT_UNSPECIFIED = 0;
    PREVIOUS_PERIOD = 1;
    SAME_PERIOD_LAST_YEAR = 2;
    SAME_PERIOD_LAST_QUARTER = 3;
    SAME_PERIOD_LAST_MONTH = 4;
    SAME_DAY_LAST_WEEK = 5;
    SAME_DAY_LAST_MONTH = 6;
    SAME_DAY_LAST_YEAR = 7;
    YESTERDAY_LAST_YEAR = 8;
    YESTERDAY_LAST_MONTH = 9;
    YESTERDAY_LAST_WEEK = 10;
    TODAY_LAST_YEAR = 11;
    TODAY_LAST_MONTH = 12;
  }
  
  ComparisonType type = 1;
  string label = 2;               // UI Semantic label ("vs Ayer")
  
  // Custom Semantic Offset (Only evaluated if type == TIME_SHIFT_RELATIVE). 
  string relative_granularity = 3;  // e.g. "day", "month"
  int32 relative_amount = 4;        // e.g. -1, -2
  
  // High-Level Pre-computed offset (Evaluated if type == TIME_SHIFT_SHORTCUT)
  ShiftShortcut shortcut = 5;

  // Parameters for TIME_SHIFT_ABSOLUTE. Overrides all calculation contexts.
  int64 absolute_start_ts = 6;
  int64 absolute_end_ts = 7;
  
  // Parameters for BENCHMARK
  double benchmark_value = 8;
}

message HierarchyContext {
  // Field containing the parent reference (e.g., "parent_id" or "location_id")
  string parent_field = 1;
  // ID of the parent node to expand. If empty, the backend fetches root nodes.
  string current_node_id = 2;
  // Instructs the backend to compute a boolean "has_children" dynamically without returning full children.
  bool inject_has_children = 3;
}

// Explicit semantic shape contract for MetriDSL output.
// Backward-compatible with existing `viz` hint. Engines may use both:
// - `output_cast` for validation semantics
// - `viz` for UI decoration defaults
enum OutputCastType {
  OUTPUT_CAST_UNSPECIFIED = 0;
  KPI = 1;
  TIMESERIES = 2;
  TABLE = 3;
  PIE = 4;
  BUBBLE = 5;
  CSV_EXPORT = 6;
}

message AnalyticsRequest {
  string tenant_id = 1;
  // Primary entity domain for the query (e.g. "asset").
  string entity = 2;
  // Detailed metrics to calculate.
  repeated MetricDefinition metrics = 3;
  // Dimensions for grouping/segmentation (Powers Time-Series grouping).
  repeated DimensionDefinition dimensions = 4;
  
  // Absolute BI Reference Boundaries. (Overrides random temporal filters inside FilterNode)
  TimeFrameContext time_frame = 5;
  
  // Modern recursive filters (AND/OR/NOT trees). (Excluding Temporal properties)
  repeated FilterNode filters = 6;
  
  // Performance and pagination.
  int32 limit = 7;            // Max items per page
  string cursor = 8;          // Opaque token from the previous `next_cursor` (Index-Range Pointer)
  repeated SortDefinition sort = 9;
  
  // Visualization Hint for Server-Driven UI mapping:
  // e.g. "bar", "line", "area", "scatter", "pie", "donut", "kpi", "gauge", "table", "tree"
  string viz = 10;
  // Semantic output contract from MetriDSL (`AS ...`).
  // Used by Janus/Aegis guards to validate matrix shape and constraints before responding.
  OutputCastType output_cast = 17;
  
  // Modern flexible formulas/measures for ad-hoc math analysis (e.g. "income - tax").
  // Modern flexible formulas/measures for ad-hoc math analysis (e.g. "income - tax").
  repeated FormulaEntry measures = 11;
  // Comparativas "Window" usando Time-Travel (WoW, YoY, vs Benchmark).
  repeated AnalyticalComparison comparisons = 12;
  
  // Global search query (Omnisearch / FTS).
  // When an AttributeSchema has `fts: true`, Janus routes this string to:
  // - OLAP: Levenshtein distance & Trigram matching on Presto/Athena.
  // - OLTP: Native Apache Lucene `d/fulltext` index on Datomic.
  string search = 13;

  // Strategy for Lazy-Loading UI visual Trees usando pseudo-queries (has_children).
  HierarchyContext hierarchy = 14;
  
  // Referencias a la Base de Conocimiento Centralizada (Capa Semántica).
  // Si está presente, Aegis hace override a las "measures" buscando su fórmula original en el Schema Registry.
  repeated SemanticMetricRef semantic_measures = 15;
  
  // MQL (Metri Query Language) Árbol de Proyección y Expansión.
  // Combina Extracción Jerárquica O(1) y Métricas Virtuales Dinámicas (`_sum`, `_avg`, `_count`).
  // Janus lo traduce velozmente a un AST `d/pull` delegando la matemática al motor analítico.
  // Nota contractual:
  // - El alias DSL es `select`, pero en gRPC el campo oficial es `select_tree`.
  // - `sort` y `limit` nativos viven en AnalyticsRequest. Si aparecen anidados dentro del
  //   árbol MQL, son extensiones interpretadas por Janus sobre este Struct.
  google.protobuf.Struct select_tree = 16;
}

// 2. MOTOR DE CROSS-FILTERING Y DRILL-DOWN MUNDIAL
// Guarda la procedencia y estado global. Si el usuario pincha "Abril" en una gráfica,
// el cliente envía este contexto y Janus le inyecta esos filtros (Ej. Month=April) al Mega-Batch.
// GUARDIA DOMINIAL: Janus ejecuta dinámicamente un "Foreign Key Pruning". Si el Cross-Filter 
// afecta una entidad hija que matemáticamente no cuenta con dicha columna transaccional, Janus 
// recorta (ignora) la rama antes de inyectarlo, evitando crashear las demás telemetrías del Dashboard.
message DashboardCrossFilterContext {
  string source_chart_id = 1;              // Gráfica que disparó el evento (ej. "pie_chart_status")
  repeated FilterNode cross_filters = 2;   // Los filtros extraídos a inyectar al Mega-Batch
}


message QueryMetadata {
  int64 execution_time_ms = 1;
  int64 total_count = 2;
  string engine = 3; // e.g. "datomic", "duckdb"
  bool is_semantic = 4;
  int32 total_queries = 5;
  double parallelism_factor = 6;
  int32 cache_hits = 7;
  
  // Distributed Tracing: Correlation ID for logs across Janus, Aegis and Hermes.
  string query_id = 8;
  // Cache Policy Insight: Seconds remaining before this result becomes stale.
  int64 cache_ttl_seconds = 9;
}

message ColumnSchema {
  string key = 1;
  string label = 2;
  string type = 3;      // "string", "number", "boolean", "date"
  string format = 4;    // "usd", "percentage", "relative_time"
  bool is_dimension = 5;
  bool is_measure = 6;
}

message DataRow {
  repeated google.protobuf.Value values = 1;
}

// =============================================================================
// MASSIVE DATA STRUCTURE (Performance Optimized RowSet)
// =============================================================================
// Transmits huge Tabular networks or Multi-Series results efficiently.
// Avoids the overhead of Array-of-Objects `[{"x": 1}]` by decoupling the layout.
// Emits the header structure ONCE in `ColumnSchema` and streams `[[1], [2]]` in rows.
// Wrapper to support oneof mutual exclusivity 
message DataRowList {
  repeated DataRow iter = 1;
}

message RowSet {
  // Definition of the columns (Label, Format, Datatype).
  repeated ColumnSchema columns = 1;
  
  // Exclusividad Mutua Arquitectónica
  oneof payload_strategy {
    // Standard Object Mapper Array for small tabular graphics (JSON-like)
    DataRowList rows_json = 2;
    // High-Performance Binary Payload (Bypasses Proto mapping for large datasets 
    // delegating RAW C++ bytes directly to Arrow/Parquet WASM streams).
    bytes arrow_binary_blob = 3; 
    // Massive Scale Export Strategy (API Gateway Evasion)
    // Overcomes the 10MB limit and 29s timeout of AWS API Gateway. Janus forces Aegis to 
    // dump CSV/Parquet directly to AWS S3, returning a short-lived Presigned URL.
    string presigned_csv_url = 4;
  }
}

message MultiSeriesGroup {
  string group_id = 1;            // El identificador llave (key) que surgirá en `batch_results`. (Ej. "grafica_ingresos_vs_costos")
  repeated string query_keys = 2; // Referencia las llaves de las consultas a procesar y fusionar en Outer-Join (Ej. ["ingresos_q", "costos_q"])
  string override_viz = 3;        // Decorador de estilo que dictará a la gráfica combinada resultante (Ej. "area")
}

message QueryRequest {
  string tenant_id = 1;
  // Mapa gigante de consultas base N (Para dashboards inmensos)
  map<string, AnalyticsRequest> queries = 2;
  
  // Shared configuration to avoid repeating filters
  BatchContext context = 3;
  
  // Advanced Multi-Series Grouping:
  // Si envías llaves agrupadas aquí, Janus anulará sus resultados individuales y los fusionará 
  // usando un Full Outer Join asintótico (Multiserie), retornándolos consolidados bajo `group_id`.
  // Todo lo que quede libre en el mapa `queries` se operará como Pie-charts / Gráficas Individuales Standalone.
  repeated MultiSeriesGroup merge_groups = 4;
  
  map<string, string> aliases = 5;
  
  // Directriz de Estado HATEOAS / Drill-Down Global para interconexión de Dashboards.
  DashboardCrossFilterContext cross_filter_context = 6;
  
  // Dry-Run / Debugging - Omite Aegis Transmute y retorna Janus AST IR compilado.
  bool explain_plan = 99;
}

// 3. CHRONOS ALERTING & BURSTING (Inatendido)
// Motor de Trabajos. Declara y registra qué consulta lanzar asincrónicamente y a dónde enviarla si la validación falla/pasa.
message ChronosAlertTask {
  string task_id = 1;
  string cron_expression = 2;           // ej. "0 8 * * 1" (Lunes a las 8 AM)
  QueryRequest condition_query = 3;     // El Mega-Batch a correr silenciosamente
  double alert_threshold = 4;           // Umbral matemático condicional de la alerta
  string webhook_url = 5;               // Sistema que recibe la explosión de los datos (Slack/Teams)
  repeated string email_recipients = 6; // PDF Mail Bursting
}

message QueryResponse {
  Status status = 1;

  // Se devuelve plano si la petición fue unitaria. 
  // O Representa la gráfica interna plana cuando viene dentro del `batch_results`.
  RowSet data = 2;
  VizMeta viz_ext = 4;

  // Mapa final del Dashboard. 
  // Contendrá Gráficas Independientes (`chart_1`, `chart_2`) y los
  // Mega-Clusters Multiseries combinados dictados en `merge_groups` (`group_id`).
  map<string, QueryResponse> batch_results = 5;

  QueryMetadata metadata = 6;
  Pagination pagination = 7;
  repeated Link links = 8;
}

message BatchContext {
  repeated FilterNode common_filters = 1; // Applied to ALL queries in the batch
  string common_entity = 2;              // Default entity if not specified per query
}

// =============================================================================
// VISUALIZATION MESSAGES (UI Data)
// =============================================================================

// =============================================================================
// INTELLIGENCE & ATOMIC SIGNALS 
// Supported Visualizations: "kpi", "indicator", "gauge"
// =============================================================================

// Decouples all actuarial mathematics from the Frontend.
message IntelligenceSignal {
  string direction = 1;      // "up", "down", "neutral"
  double percentage = 2;     // Evaluated % change vs previous time-bucket
  double delta_abs = 3;      // Absolute mathematical difference
  double previous_value = 4; // The historical value we compared against
  string label = 5;          // Context label generated by backend (e.g., "vs Last Week")
  
  // Advanced Statistical Flags:
  bool is_anomaly = 6;       // True if this jump breaks the Gaussian limits (Alert UI to paint Red)
  double z_score = 7;        // Confidence / Deviation algebraic score
  bool represents_initial = 8;
}

// Master wrapper used for non-tabular atomic queries.
message AnalyticalSignal {
  double value = 1;              // The absolute Result set (e.g. "Total Costs = 2500")
  double previous_value = 2;     // Required for visual sparklines
  IntelligenceSignal intelligence = 3; // Attached math engine wrapper
  repeated double history = 4;   // Micro-arreglo to graph background "Sparklines" immediately
  repeated IndicatorThreshold thresholds = 5; // e.g. [Warning > 80, Error > 95]
  string unit = 6;               // UI suffix: "USD", "%", "kWh"
  string status_label = 7;
  string entity_ref = 8;
}


message TableColumn {
  enum Alignment {
    ALIGNMENT_UNSPECIFIED = 0;
    LEFT = 1;
    CENTER = 2;
    RIGHT = 3;
  }
  string key = 1;
  string label = 2;
  string type = 3; 
  Alignment align = 4;
  bool sortable = 5;
  string format = 6; 
  google.protobuf.Struct metadata = 7;
  string entity_ref = 8;
}
 // Target domain for drill-down action

message TableMeta {
  repeated TableColumn columns = 1;
  repeated Action row_actions = 2;
  repeated Link global_links = 3;
}

message IndicatorThreshold {
  double value = 1;
  string color = 2; // e.g., "success", "warning", "error" or hex
  string label = 3;
}

// =============================================================================
// CARTESIAN CHARTS 
// Supported Visualizations: "bar", "line", "area", "scatter"
// =============================================================================
// Frontend binds natively to Apache ECharts using the `dataset` property.
// The backend RowSet behaves exactly as ECharts `dataset.source` (Array of Arrays).
// Thus, this ChartDecoration merely acts as the ECharts `series.encode` mapper.
message ChartDecoration {
  // ECharts Dataset Encoding Strategy 
  string x_dimension = 1;           // Maps to ECharts `encode: { x: '...' }`
  repeated string y_dimensions = 2; // Maps to multiple ECharts `series` with `encode: { y: '...' }`
  
  // ECharts Component Toggles
  string color_scheme = 3;          // Applies ECharts `color` registered themes
  bool show_legend = 4;             // Toggles ECharts `legend: { show: true }`
  bool show_tooltip = 5;            // Toggles ECharts `tooltip: { trigger: 'axis' }`
  string title = 6;                 // Maps to ECharts `title.text`
  
  // Specific Visual Hooks
  bool stacked = 7;                 // Automatically assigns `stack: 'total'` to ECharts series
  bool smooth = 8;                  // For 'line' charts: applies `smooth: true`

  // Label Template — Mustache-style interpolation for series/slice labels.
  // Supports {{field}} placeholders resolved against each data row at render time.
  // Example: "{{asset_name}} - {{total_cost}} USD"
  // Applied via ECharts `series.label.formatter` and `tooltip.formatter`.
  string label_template = 9;

  // Fill Gaps — ANO-005: when true, the frontend must interpolate missing time buckets
  // in TIMESERIES visualizations (connect null values or insert zero-value points).
  // Set by the engine for TIMESERIES output_cast when data is sparse.
  bool fill_gaps = 10;
}

// =============================================================================
// CIRCULAR BREAKDOWNS 
// Supported Visualizations: "pie", "donut"
// =============================================================================
// Flattens continuous series into dictionary maps.
// Frontend translates this gracefully into ECharts `{ data: [{ name, value }] }` natively.
message BreakdownSignal {
  // Map Key = ECharts 'name' (Sector identifier, e.g. "Mechanical Area")
  // Value = AnalyticalSignal (its % weight inside the donut loop)
  map<string, AnalyticalSignal> signals = 1;
}

// =============================================================================
// HIERARCHICAL NAVIGATION (Lazy Loading)
// Supported Visualizations: "tree"
// =============================================================================
// Maps physical inheritance (e.g. Building -> Floor -> Machine)
message TreeMeta {
  string id_key = 1;               // Column mapped to the ID
  string parent_id_key = 2;        // Column mapped to the parent ID (Foreign Key)
  string label_key = 3;            // Semantic target to draw as node label
  string has_children_key = 4;     // Core Optimization: Boolean injected so React doesn't pre-fetch children
  string icon_key = 5;             // Maps the entity state to an SVG icon identifier
}

// =============================================================================
// VIZMETA MASTER CONTAINER (Server-Driven UI Concept)
// =============================================================================
// Defines an unfakeable design contract that shields the frontend.
// Tuned specifically to feed Apache ECharts efficiently.
message VizMeta {
  // ECharts generic type: "bar", "line", "scatter", "pie", etc.
  string type = 1;

  oneof payload {
    AnalyticalSignal signal = 2; 
    ChartDecoration chart = 3;   
    TableMeta table = 4;         
    BreakdownSignal breakdown = 5;
    TreeMeta tree = 6; 
  }
}

// =============================================================================
// OPERATIONAL MESSAGES (Transactions)
// =============================================================================

enum OperationAction {
  // Safe default — Prioridad MÁXIMA: Janus rechaza TransactionRequest con :JANUS_400.
  // Un mensaje no inicializado con action=0 NUNCA debe ejecutar una escritura en Datahike.
  // proto3 best-practice: el valor 0 SIEMPRE debe ser un sentinel no-op (never execute).
  OPERATION_ACTION_UNSPECIFIED = 0;
  CREATE = 1;
  UPDATE = 2;
  DELETE = 3;
  UPSERT = 4;
  GET = 5;
}

message TransactionRequest {
  string tenant_id = 1;
  string entity_type = 2;
  string entity_id = 3;
  OperationAction action = 4;
  google.protobuf.Struct payload = 5;
  // Bandera Anti-Flooding: Si es true, el Motor OLTP ejecutará la escritura y censurará cualquier tupla Outbox impidiendo detonar webhooks o EDA.
  bool suppress_events = 6;
}

message TransactionResponse {
  Status status = 1;
  string entity_id = 2;
  google.protobuf.Struct result = 3;
}

message BulkRequest {
  string tenant_id = 1;
  string entity_type = 2;
  OperationAction action = 3;
  // Next-gen high-speed ingestion via columnar RowSet.
  RowSet data = 4; 
}

message BulkResponse {
  Status status = 1;
  int32 ingested_count = 2;
  int32 outbox_count = 3;
}

// =============================================================================
// EDA MESSAGES (Event Router Inverse Query)
// =============================================================================

message MatchRoutingRulesRequest {
  string tenant_id = 1;
  string entity_name = 2;          // e.g. "work_order"
  string trigger_type = 3;         // e.g. "on_update", "on_create"
  // Transporta el $new y $delta transaccional estructurado puramente en JSON.
  bytes cdc_payload_json = 4;
}

message WebhookTarget {
  // Absolute HTTPS URL of the target endpoint.
  string target_url = 1;

  // HTTP verb: "POST", "PUT", "PATCH" (default: "POST").
  string http_method = 2;

  // Auth strategy: NONE | BEARER_TOKEN | BASIC_AUTH | CUSTOM_HEADER
  string auth_type = 3;

  // The resolved secret injected by Clojure after looking up the corporate vault.
  // Never sourced from client input — always resolved server-side.
  string resolved_auth_secret = 4;

  // Max delivery attempts before dead-lettering (0 = no retry, max: 10).
  int32 max_retries = 5;

  // Timeout per delivery attempt in seconds (default: 10, max: 60).
  int32 timeout_seconds = 6;

  // Arbitrary HTTP headers injected into the webhook delivery.
  // Common use: Authorization, X-Tenant-ID, Content-Type overrides.
  map<string, string> headers = 7;
}

message MatchedRule {
  // Unique rule identifier (maps to the Codex routing_rule entity).
  string rule_code = 1;

  // EventBridge / SQS detail-type for the outbound event envelope.
  string detail_type_output = 2;

  // Dynamic 1:N fan-out to webhook endpoints (adapted from webhook_endpoint.json).
  repeated WebhookTarget webhooks = 3;

  // Execution priority: lower integer = evaluated first.
  // Rules with the same priority are evaluated in lexicographic rule_code order.
  int32 priority = 4;

  // Human-readable name for observability dashboards and audit logs.
  string name = 5;

  // Optional filter tree that must match the CDC payload for this rule to fire.
  // When null, the rule matches ALL events of the registered trigger_type.
  FilterNode condition = 6;
}

message MatchRoutingRulesResponse {
  Status status = 1;
  // Devuelve la metafísica de la regla victoriosa, jamás el Payload (Golang ya lo tiene en memoria).
  repeated MatchedRule matched_rules = 2;
}

message MatchRoutingRulesBatchRequest {
  // Enviar 10 eventos en paralelo
  repeated MatchRoutingRulesRequest requests = 1;
}

message MatchRoutingRulesBatchResponse {
  Status status = 1;
  // Devuelve una lista de respuestas que se alinean por índice con los requests
  repeated MatchRoutingRulesResponse responses = 2;
}

