[package]
name    = "metri-engine"
version = "0.1.0"
edition = "2021"

# ─── Runtime asíncrono ────────────────────────────────────────────────────────
[dependencies]
tokio          = { version = "1",  features = ["full"] }
futures        = "0.3"

# ─── gRPC / Protobuf (Tonic + prost) ─────────────────────────────────────────
tonic          = { version = "0.11", features = ["tls"] }
prost          = "0.12"
prost-types    = "0.12"

# ─── AWS SDK ─────────────────────────────────────────────────────────────────
aws-config     = { version = "1",  features = ["behavior-version-latest"] }
aws-sdk-dynamodb   = "1"
aws-sdk-s3         = "1"
aws-sdk-athena     = "1"
aws-sdk-sqs        = "1"
aws-sdk-kinesis    = "1"
aws-sdk-firehose   = "1"
aws-sdk-glue       = "1"
aws-sdk-eventbridge = "1"

# ─── AWS Lambda Runtime ───────────────────────────────────────────────────────
lambda_runtime = "0.11"

# ─── Serialización ────────────────────────────────────────────────────────────
serde          = { version = "1",  features = ["derive"] }
serde_json     = "1"
rmp-serde      = "1"           # MessagePack (CompositeCursor)
base64         = "0.22"

# ─── Codice / Schemas ─────────────────────────────────────────────────────────
sha2           = "0.10"        # SHA-256 fingerprint + HMAC (reemplaza MessageDigest JVM)
hex            = "0.4"
async-trait    = "0.1"         # Traits async — equivale a defprotocol con métodos async

# ─── Identidad y tiempo ───────────────────────────────────────────────────────
ulid           = "1"           # ULID generator (reemplaza janus_router/ulid.clj)
uuid           = { version = "1", features = ["v4"] }
chrono         = { version = "0.4", features = ["serde"] }
chrono-tz      = "0.9"         # shift_by_calendar / timezone-aware (reemplaza java.time.ZonedDateTime)

# ─── SQL Compiler ─────────────────────────────────────────────────────────────
sea-query      = { version = "0.31", features = ["attr", "backend-mysql", "backend-postgres"] }

# ─── FlatBuffers (Janus ↔ EAV contract) ──────────────────────────────────────
flatbuffers    = "25.12.19"

# ─── Autorización Cedar (ABAC) ────────────────────────────────────────────────
cedar-policy   = "3"

# ─── OpenTelemetry ────────────────────────────────────────────────────────────
opentelemetry              = "0.23"
opentelemetry-otlp         = "0.16"
opentelemetry_sdk          = "0.23"
tracing                    = "0.1"
tracing-opentelemetry      = "0.24"
tracing-subscriber         = { version = "0.3", features = ["env-filter"] }

# ─── Compresión IoT ──────────────────────────────────────────────────────────
lz4_flex       = "0.11"        # Telemetría IoT blob compression (Módulo 10 EAV)

# ─── Crypto (HMAC tenant guard) ───────────────────────────────────────────────
hmac           = "0.12"
bcrypt         = "0.15"
hex-literal    = "0.4"
constant_time_eq = "0.3"       # constant-time HMAC comparison (timing-safe)

# ─── Errores ─────────────────────────────────────────────────────────────────
thiserror      = "1"
anyhow         = "1"

# ─── Utilidades ──────────────────────────────────────────────────────────────
once_cell      = "1"           # OnceLock estático para CodeRegistry + FLAG_STORE
regex          = "1"           # aegis/sql/fuzzy_sql.clj patterns
itertools      = "0.12"
rand           = "0.8"         # CSPRNG equivalente a java.security.SecureRandom (base36)
http           = "0.2"         # Tipos HTTP necesarios para el stub gRPC Tonic FASE 1
lazy_static = "1.5.0"
tokio-stream = "0.1.18"
lambda_http = "1.2.0"
tonic-web = "0.11"
tower = "0.5.3"
tower-http = { version = "0.4.4", features = ["cors"] }
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
toml = "1.1.2"
tonic-reflection = "0.11.0"
csv = "1.3"

# ─── Build ───────────────────────────────────────────────────────────────────
[build-dependencies]
tonic-build    = "0.11"
prost-build    = "0.12"

[profile.dev]
debug = 1                      # Line tables only, reduces target/debug size significantly
incremental = true

[profile.release]
opt-level     = 3
lto           = false          # Disable LTO for fast, low-memory local builds
codegen-units = 16             # Parallel codegen to reduce build time and memory usage
strip         = true           # Strip debug symbols → smaller binary

[lib]
name = "metri_engine"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"             # El binario se llama `bootstrap` — requerido por provided.al2023
path = "src/main.rs"

[dev-dependencies]
insta = "1.47.2"
proptest = "1.11.0"
